# Long-cache Astro's content-hashed assets; they never change for a given hash.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers for all responses.
# Framing: this site, plus Broward County Public Schools' Canvas LMS, which the legacy site
# allowed to embed it (X-Frame-Options ALLOW-FROM). frame-ancestors replaces X-Frame-Options:
# browsers ignore ALLOW-FROM, and SAMEORIGIN would block that embed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' https://browardschools.instructure.com"

# X-Robots-Tag: noindex for *.netlify.app hosts (staging / previews / branch deploys)
# is added per-request by netlify/edge-functions/noindex-netlify-host.ts (declared
# inline via its `config` export). [[headers]] here can't condition on Host, and the
# production custom domain must NOT get the header.
