# Netlify deploy config. pnpm + lockfile are auto-detected via package.json `packageManager`.
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The Help Center moved to its own subdomain (second Netlify site built from this
# repo — see sites/help/netlify.toml). 301 every old /help URL to its new home so
# links + search indexing carry over; article slugs are unchanged, only the prefix
# drops (/help/classroom-setup/ → help.innerexplorer.com/classroom-setup/).
[[redirects]]
  from = "/help"
  to = "https://help.innerexplorer.com/"
  status = 301
  force = true

[[redirects]]
  from = "/help/*"
  to = "https://help.innerexplorer.com/:splat"
  status = 301
  force = true

# The /support FAQ moved to /faq (the Help Center now owns guided how-to docs).
# 301 so existing links + search indexing carry over. `force` wins over the static
# redirect page Astro also emits for /support.
[[redirects]]
  from = "/support"
  to = "/faq"
  status = 301
  force = true

# /privacy is the short form people type and hand-link; the canonical policy page is
# /privacy-policy. `force` wins over the static redirect page Astro also emits.
[[redirects]]
  from = "/privacy"
  to = "/privacy-policy/"
  status = 301
  force = true

# Long-cache Astro's content-hashed assets; they never change for a given hash.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers for all responses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# PRE-LAUNCH: noindex EVERY host (including the production custom domain) until the
# site launches. DELETE this block at launch — the netlify.app-only edge function
# below keeps staging/previews noindexed permanently, so removing this re-opens
# indexing for the production domain only.
# robots.txt must keep `Allow: /` so crawlers can fetch pages and see this header.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# X-Robots-Tag: noindex for *.netlify.app hosts (staging / previews / branch deploys)
# is added per-request by netlify/edge-functions/noindex-netlify-host.ts (declared
# inline via its `config` export). [[headers]] here can't condition on Host, and the
# production custom domain must NOT get the header.
