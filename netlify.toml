# Netlify deploy config. pnpm + lockfile are auto-detected via package.json `packageManager`.
[build]
  command = "pnpm verify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Netlify runs pnpm install before the build command. Make the lockfile contract
  # explicit in addition to pnpm's CI default.
  PNPM_FLAGS = "--frozen-lockfile"

# The Help Center moved to its own subdomain (second Netlify site built from this
# repo — see sites/help/netlify.toml). 301 every old /help URL to its new home so
# links + search indexing carry over; article slugs are unchanged, only the prefix
# drops (/help/classroom-setup/ → help.innerexplorer.com/classroom-setup/).
[[redirects]]
  from = "/help"
  to = "https://help.innerexplorer.com/"
  status = 301
  force = true

[[redirects]]
  from = "/help/*"
  to = "https://help.innerexplorer.com/:splat"
  status = 301
  force = true

# The FAQ lives in the Help Center. /support was its old address. `force` wins over the
# static redirect pages Astro also emits (astro.config.mjs mirrors these rules for dev).
[[redirects]]
  from = "/faq"
  to = "https://help.innerexplorer.com/faq/"
  status = 301
  force = true

[[redirects]]
  from = "/support"
  to = "https://help.innerexplorer.com/faq/"
  status = 301
  force = true

# /privacy is the short form people type and hand-link; the canonical policy page is
# /privacy-policy.
[[redirects]]
  from = "/privacy"
  to = "/privacy-policy/"
  status = 301
  force = true

# -- Legacy site (innerexplorer.com before the rebuild; an Apache site, not this repo) ----
# Every URL from its sitemap and its internal links. Its pages answered with and without
# `.html`, so both forms are listed. Placed above the /blog rules: the first match wins.

# District portals and sign-up links (/compass/portals/<district>, /compass/<district>,
# /compass/signupv9…). Schools bookmark these. The legacy server 302'd them to the app
# (sign-up versions to /signup, everything else to /login), and so do these. Netlify splats
# match whole segments only, so the sign-up paths are listed.
[[redirects]]
  from = "/compass/signup"
  to = "https://app.innerexplorer.com/signup"
  status = 302
  force = true

[[redirects]]
  from = "/compass/signupv8"
  to = "https://app.innerexplorer.com/signup"
  status = 302
  force = true

[[redirects]]
  from = "/compass/signupv9"
  to = "https://app.innerexplorer.com/signup"
  status = 302
  force = true

[[redirects]]
  from = "/compass/*"
  to = "https://app.innerexplorer.com/login"
  status = 302
  force = true

