name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One job, so branch protection's required `verify` check stays the same. Covers
      # code, both site builds, the CloudCannon configuration and Visual Editor bindings.
      - run: pnpm verify && pnpm verify:help
