# Netlify config for the HELP CENTER site (help.innerexplorer.com) — a second
# Netlify site on this same repo. Set the site's "base directory" to `sites/help`
# in the Netlify UI so this file (not the repo-root netlify.toml) governs it.
# Paths below are relative to that base.
[build]
  command = "cd ../.. && pnpm install && pnpm build:help"
  publish = "../../dist-help"
  # ALWAYS build. Netlify's default for a site with a base directory is to cancel the
  # build when nothing under that base changed ("no content change") — which is wrong
  # here: this directory holds only config, while the build's real inputs are the whole
  # repo (src/, src-help/, astro.help.config.mjs, astro.config.shared.mjs, package.json,
  # the lockfile). That default silently dropped the Help Center copy changes in PRs #57
  # and #58 on 2026-07-23. An `ignore` command cancels on exit 0 and builds on non-zero,
  # so `exit 1` opts out of the heuristic entirely. Do not "optimize" this into a scoped
  # git diff — the input list is the repo, and a stale list fails silently (no build, no
  # error, just old content live).
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "24"
  # pnpm is normally auto-detected from a pnpm-lock.yaml in the BASE directory —
  # ours lives at the repo root, so opt in explicitly or `pnpm` won't be installed.
  NETLIFY_USE_PNPM = "true"

# One public address: send the Netlify default domain to the real one. Netlify sets
# help.innerexplorer.com as this site's primary domain but does NOT redirect
# inner-explorer-help.netlify.app to it, so the same content answered on two hosts.
#
# The `from` names that ONE host explicitly rather than a wildcard, so deploy previews
# (deploy-preview-N--inner-explorer-help.netlify.app) and branch deploys
# (main--inner-explorer-help.netlify.app) keep serving normally — you need those to
# review changes. `force` is required to win over the static file that would otherwise
# be served.
[[redirects]]
  from = "https://inner-explorer-help.netlify.app/*"
  to = "https://help.innerexplorer.com/:splat"
  status = 301
  force = true

# Long-cache Astro's content-hashed assets; they never change for a given hash.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers for all responses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# X-Robots-Tag: noindex for *.netlify.app hosts is added per-request by
# sites/help/netlify/edge-functions/noindex-netlify-host.ts (a copy of the root
# one — with a base directory set, Netlify only discovers edge functions under
# <base>/netlify/edge-functions).

# PRE-LAUNCH: noindex EVERY host (including help.innerexplorer.com) until the Help
# Center is ready to be indexed. DELETE this block to launch it — the netlify.app-only
# edge function noted above keeps staging/previews noindexed permanently, so removing
# this re-opens indexing for the custom domain only.
#
# Mirrors the same block in the repo-root netlify.toml, deliberately: without it the
# custom domain would be fully indexable the moment it is attached, because the edge
# function only matches hosts ending in `.netlify.app`.
#
# robots.txt must keep `Allow: /` so crawlers can fetch pages and see this header — a
# Disallow would hide the noindex, and Google can index an uncrawled URL from links.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
