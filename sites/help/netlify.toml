# Netlify config for the HELP CENTER site (help.innerexplorer.com) — a second
# Netlify site on this same repo. In Netlify, leave the Base directory empty so
# dependencies install at the repository root, and set Package directory to
# `sites/help` so this file (not the root netlify.toml) governs the Help site.
# Paths below are relative to the repository-root Base directory.
[build]
  command = "pnpm verify:cms"
  publish = "dist-help"
  edge_functions = "sites/help/netlify/edge-functions"
  # ALWAYS build. This site's inputs span the whole repository (src/, src-help/,
  # shared Astro config, package.json, and the lockfile). An `ignore` command cancels
  # on exit 0 and builds on non-zero, so `exit 1` opts out of an unsafe scoped check.
  # Do not replace this with a partial file list: a stale list fails silently by
  # leaving old content live.
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "24"
  # Netlify runs pnpm install from the repository-root Base directory before the
  # build command. Keep that install locked to the committed dependency graph.
  PNPM_FLAGS = "--frozen-lockfile"

# One public address: send the Netlify default domain to the real one. Netlify sets
# help.innerexplorer.com as this site's primary domain but does NOT redirect
# inner-explorer-help.netlify.app to it, so the same content answered on two hosts.
#
# The `from` names that ONE host explicitly rather than a wildcard, so deploy previews
# (deploy-preview-N--inner-explorer-help.netlify.app) and branch deploys
# (main--inner-explorer-help.netlify.app) keep serving normally — you need those to
# review changes. `force` is required to win over the static file that would otherwise
# be served.
[[redirects]]
  from = "https://inner-explorer-help.netlify.app/*"
  to = "https://help.innerexplorer.com/:splat"
  status = 301
  force = true

# Long-cache Astro's content-hashed assets; they never change for a given hash.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers for all responses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# X-Robots-Tag: noindex for *.netlify.app hosts is added per-request by
# sites/help/netlify/edge-functions/noindex-netlify-host.ts (selected explicitly
# above so the Help site never relies on the root site's function discovery).

# PRE-LAUNCH: noindex EVERY host (including help.innerexplorer.com) until the Help
# Center is ready to be indexed. DELETE this block to launch it — the netlify.app-only
# edge function noted above keeps staging/previews noindexed permanently, so removing
# this re-opens indexing for the custom domain only.
#
# Mirrors the same block in the repo-root netlify.toml, deliberately: without it the
# custom domain would be fully indexable the moment it is attached, because the edge
# function only matches hosts ending in `.netlify.app`.
#
# robots.txt must keep `Allow: /` so crawlers can fetch pages and see this header — a
# Disallow would hide the noindex, and Google can index an uncrawled URL from links.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
