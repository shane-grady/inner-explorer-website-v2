audience:
  eyebrow: "Who it's for"
  heading: 'Made for the adults in the building'
  intro: >-
    Every practice meets you where your day is — between classes, before the bell,
    or after everyone has gone home.
  cards:
    - icon: 'presentation'
      title: 'Teachers'
      body: >-
        For the moments between lessons, when you need to reset before the next
        group walks in.
    - icon: 'lifebuoy'
      title: 'School staff'
      body: >-
        Counselors, aides, and front-office teams carry the day's weight too.
        These practices are for them.
    - icon: 'compass'
      title: 'School leaders'
      body: >-
        Principals and administrators set the tone for a building. Calm is
        contagious — it starts at the top.

stats:
  eyebrow: 'Why it matters'
  heading: 'The most stressed profession deserves the most support'
  intro: >-
    Educators report the highest levels of occupational burnout and symptoms of
    depression of any profession. Daily mindfulness is a simple, proven way to meet
    that pressure — a few quiet minutes that compound into steadier days.
  items:
    - { value: '43%', label: 'less stress reported by educators who practice daily mindfulness' }
    - { value: '28%', label: 'higher grades in reading, math, and science across classrooms' }
    - { value: '60%', label: 'fewer behavioral issues when mindfulness becomes a daily habit' }
  footnote: >-
    Inner Explorer is built on the Mindfulness-Based Stress Reduction (MBSR)
    protocol — a method backed by more than 9,000 studies.

practices:
  eyebrow: 'Inside the series'
  heading: 'A practice for every part of your day'
  intro: >-
    Short, themed sessions designed to fit a full schedule — from the first bell to
    the drive home.
  items:
    - title: 'Start Your Day'
      theme: 'Intention'
      duration: '5 min'
      image: '../../assets/images/series/practice-morning.jpg'
      blurb: 'A grounding practice to meet the morning before the morning meets you.'
    - title: 'Stress Resilience'
      theme: 'Regulation'
      duration: '7 min'
      image: '../../assets/images/series/practice-regulation.jpg'
      blurb: "Notice the tension you're holding, and let it soften one breath at a time."
    - title: 'A Moment of Gratitude'
      theme: 'Gratitude'
      duration: '4 min'
      image: '../../assets/images/series/practice-gratitude.jpg'
      blurb: 'Close the day by naming what went right, however small.'
    - title: 'Between the Bells'
      theme: 'Reset'
      duration: '2 min'
      image: '../../assets/images/series/practice-reset.jpg'
      blurb: 'A quick transition to clear the last class before the next one arrives.'
    - title: 'Self-Compassion'
      theme: 'Kindness'
      duration: '8 min'
      image: '../../assets/images/series/practice-kindness.jpg'
      blurb: 'Offer yourself the same patience you so easily give your students.'
    - title: 'Unwind at Home'
      theme: 'Rest'
      duration: '10 min'
      image: '../../assets/images/series/practice-rest.jpg'
      blurb: 'Leave the day at the door and let your body finally rest.'

how:
  eyebrow: 'How it works'
  heading: 'No prep. No training. Just press play.'
  steps:
    - icon: 'play'
      title: 'Press play'
      body: >-
        Open Inner Explorer on any device and start. There is nothing to plan and
        nothing to teach.
    - icon: 'headphones'
      title: 'Practice 2–10 minutes'
      body: >-
        Each session is audio-guided, so you can close your eyes and fully relax —
        no screen required.
    - icon: 'map-pin'
      title: 'Anywhere you are'
      body: >-
        At your desk, in the car, or on the couch at home. The habit travels
        with you.

benefits:
  eyebrow: 'The benefit'
  heading: 'What a few mindful minutes give back'
  items:
    - icon: 'wind'
      title: 'Less stress, more steadiness'
      body: >-
        Regular practice eases the symptoms of chronic stress that build over a
        long school year.
    - icon: 'focus'
      title: 'Sharper focus'
      body: 'A short reset restores the attention that demanding days quietly wear down.'
    - icon: 'sparkles'
      title: 'Model the calm'
      body: 'Students learn to regulate by watching the adults around them do it first.'
    - icon: 'repeat'
      title: 'A habit that lasts'
      body: >-
        Designed for school and home, so mindfulness becomes part of life — not
        just the lesson plan.

