howItWorks:
  eyebrow: A five-minute morning
  headingLead: Three steps.
  headingAccent: Then the day begins.
  steps:
    - time: 8:00 AM
      n: '01'
      title: Choose a practice
      body: Pick the day's themed, grade-appropriate session. It's already sequenced into a series — no planning required.
      icon: choose
    - time: 8:05 AM
      n: '02'
      title: Press play
      body: A guided voice leads the class through breathing and focus. You listen along — the calmest five minutes of the day.
      icon: play
    - time: 8:12 AM
      n: '03'
      title: Reflect & track
      body: A short journal prompt closes the practice. Mindful minutes and progress log automatically for you and your district.
      icon: reflect
