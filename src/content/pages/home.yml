pageTitle: Inner Explorer — Daily mindfulness for K-12 schools
pageDescription: Five minutes of guided audio mindfulness, every morning, in every classroom. Calmer rooms, fewer disruptions, and measurable gains — proven across two million students and ready for your whole district.
intro:
  headline: Calm Minds Learn Better
  lede: The daily audio-guided mindfulness program for PreK-12 classrooms. Reduce stress, improve focus, and foster well-being with just 5–10 minutes a day.
  cta:
    label: Get Started
    href: /contact
  imageAlt: A student sits quietly with lowered eyes during a calm moment in a busy elementary classroom.
  balanceLabel: Balance
  problem:
    title: If only finding peace in your district was as simple as pressing play.
    body: Behavioral disruptions steal weeks of instructional time every single year.
  solution:
    title: It turns out, it actually is.
    body: We reduce those disruptions by 60% with zero prep work required.
