whyNow:
  eyebrow: Why this, why now
  manifesto: Children can't learn when they're overwhelmed. Inner Explorer gives every classroom one small, daily ritual — a few minutes of breath and quiet — that makes room for everything else the school day asks of them.
  stats:
    - value: 1 in 3
      body: students carries stress or anxiety into the classroom — where it quietly erodes attention, memory, and the ability to learn.
    - value: Hours
      body: lost each week to disruption and de-escalation — time pulled away from teaching, and from teachers who are running on empty.
    - value: 44 states
      body: now require or encourage social-emotional learning — yet most schools still lack one daily practice simple enough to stick.
