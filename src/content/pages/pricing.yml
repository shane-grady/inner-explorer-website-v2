_schema: pricing
permalink: /pricing/
pageTitle: Pricing
pageDescription: Compare Inner Explorer's Early Learning, Community, and Community Pro plans feature by feature and find the right daily mindfulness license for your school, center, or district.
hero:
  eyebrow: Plans & pricing
  lead: Find the ideal plan for
  display: your learning community.
  intro: Every plan includes the full library of daily audio-guided practices, PreK through 12, in English and Spanish. Compare the three site licenses below and choose the one that fits your school, center, or district.
plans:
  note: All plans are annual per site licenses. Reach out and our team will confirm pricing for your school, center, or district.
  items:
    - id: early
      name: Early Learning
      price: $1,200
      unit: per center, per year
      blurb: Annual per site license for early learning, out-of-school-time, and after-school centers.
      ctaLabel: Contact for pricing
      ctaHref: /contact
    - id: community
      name: Community
      price: $2,800
      unit: per school, per year
      blurb: Annual per site license for a single school, with admin dashboards, single sign-on, and onboarding.
      ctaLabel: Contact for pricing
      ctaHref: /contact
      highlight: true
    - id: pro
      name: Community Pro
      price: $3,600
      unit: per school, per year
      blurb: Annual per site license with full family access, roster management, a dedicated coordinator, and the Inner Explorer guarantee.
      ctaLabel: Contact us for districtwide pricing
      ctaHref: /contact
