  eyebrow: About Inner Explorer · Est. 2011
  headlineTop: Fifteen years
  headlineBottom: of quiet practice.
  subtitle: We've spent a decade and a half bringing daily, audio-guided mindfulness into classrooms — one breath, one teacher, one child at a time. This is the story of how a small idea became a global practice.
  image: ../../assets/images/about/hero-classroom-mindfulness.png
