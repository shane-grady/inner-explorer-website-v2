objection:
  heading: “Doesn't some research say mindfulness doesn't work?”
  body: You may have seen the headlines. Look at the studies underneath them. In the largest, the UK's MYRIAD trial, students practiced outside of class on average about once over the entire program — and most never practiced at all. A skill you use once doesn't rewire a brain. That isn't a finding against mindfulness. It's a finding about dose.
  closing: 'The programs that disappoint share one trait: the kids barely practiced. Inner Explorer is daily, teacher-launched, and built into the school day. No screens, five to ten minutes. Ease and consistency are the whole difference.'
aiMoment:
  label: The AI moment · Independent research on AI and cognition — not Inner Explorer trials
  headingHtml: <span class="stk sans">AI accelerates.</span><span class="stk"><em>Mindfulness navigates.</em></span>
  paragraphs:
    - 'AI is now everywhere children learn, and the research on what it does to developing minds is arriving fast, from the most rigorous institutions in the world. The pattern is consistent: AI is powerful, but without a cognitively prepared human at the controls, that power backfires. Students stop struggling productively. Attention thins. The brain does less of its own thinking.'
    - MIT's Media Lab measured it directly. Students who leaned on AI to write showed up to 55% weaker neural connectivity and less ownership of their own work. The researchers named it cognitive debt. RAND has formally modeled a point at which that dependency becomes irreversible.
  stats:
    - stat: 17%
      label: worse on exams after AI-assisted practice · Wharton
    - stat: 17%
      label: lower skill scores with AI assistance · Cornell
    - stat: 13%
      label: employment decline among young AI-exposed workers · Stanford
  transitionHeading: What AI takes away, daily mindfulness builds back.
  riskHead: The risk, as researchers measured it
  buildHead: What daily mindfulness practice builds
  rows:
    - risk: Cognitive debt · up to 55% weaker neural connectivity (MIT Media Lab, 2025 preprint)
      build: Brain connectivity and gray-matter density
    - risk: Skill atrophy · 17% lower competency (Cornell, 2026)
      build: Metacognition and deep processing
    - risk: Productive struggle bypassed (Wharton, 2025)
      build: Sustained attention and persistence
    - risk: Entry-level job displacement (Stanford, 2025)
      build: The interpersonal, ethical, and creative capacities AI can't replace
    - risk: Agency erosion · irreversible dependency (RAND, 2026)
      build: Independent judgment and decision-making
  closingHtml: AI provides power. Mindfulness builds the executive function that provides control. The next AI race isn't about better algorithms. <em>It's about better human&nbsp;cognition.</em>
