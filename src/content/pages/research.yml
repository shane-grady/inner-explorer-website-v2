  - id: aggression
    label: Aggression
    eyebrow: Behavior & aggression
    statValue: ''
    statUnit: ''
    statCaption: ''
    headline: When kids can't find the pause.
    copy: 'Teachers are seeing it everywhere: students who escalate faster, melt down harder, and can''t put a beat between a trigger and their reaction. That isn''t defiance. It''s a nervous system stuck in fight-or-flight, with the part of the brain that governs anger and impulse knocked offline by chronic stress.'
    paragraphs:
      - There's a layer beneath the reaction. A child under chronic stress isn't reading the room the way you are. Researchers using EEG and eye-tracking found that adolescents who had experienced adversity showed blunted neural discrimination between angry faces and neutral ones. Their brains treated an ordinary expression much like a hostile one. Walking into a classroom, they are not seeing the room you see.
      - 'That''s why belonging can''t be assigned. Schools work hard to build connection, and connection matters enormously: students who feel connected at school report poor mental health at roughly half the rate of students who don''t. But a child whose threat detection is miscalibrated cannot perceive the safety a school is offering. Safety is not a feeling adults can hand to a student. It''s a reading their nervous system has to be able to make.'
      - 'Mindfulness builds the one thing those students are missing: the pause. Daily practice strengthens emotion regulation and the prefrontal control that lets a child feel anger without acting on it. It also lowers amygdala reactivity, which recalibrates the threat detection running underneath. When a neutral face reads as neutral again, the room stops being a threat, and belonging finally has somewhere to land. The wider research agrees: school-based mindfulness programs show meaningful reductions in aggressive and disruptive behavior.'
