    label: Life Skills
    eyebrow: The foundation SEL assumes
    statValue: ''
    statUnit: ''
    statCaption: ''
    headline: Social, behavioral, and emotional skill development.
    copy: 'Inner Explorer covers the same competencies that every social and emotional curriculum targets: self-awareness, emotional regulation, resilience, relationship skills, responsible decision-making, as well as discernment and critical thinking.'
    paragraphs:
      - The difference is how they're built. Curricula teach the concepts, and children learn them. A student can define self-regulation, name four calming strategies, and ace the unit. Then lose every bit of it the moment they're flooded. Social competence doesn't run on understanding. It runs on a nervous system that stays regulated when something goes wrong, and that is trained through repetition, not instruction.
      - Five minutes a day, every day, is the repetition. Not a lesson about calm. The practice of it, until the body does it on its own.
