brain:
  chapterLabel: II — Brain
  chapterNumber: II.
  headingHtml: <span class="stk sans">When stress goes,</span><span class="stk"><em>learning returns.</em></span>
  paragraphs:
    - Stress comes from many sources, both inside and outside of school. When it overwhelms the brain through the automatic fight-flight-freeze response, higher-order thinking takes a back seat. Working memory shrinks. Attention narrows. The capacity to absorb information collapses.
    - Two of every three children experience adverse childhood experiences with lasting effects. Toxic stress doesn't sit on top of learning — it physically rewires the developing brain, dampening executive function and amplifying the very stress response that began the cycle.
    - Inner Explorer's daily practice is aligned with Mindfulness-Based Stress Reduction — the most widely studied mindfulness curriculum on Earth, with <span class="inline-stat">16,000+ studies</span> over four decades. We translate that science into five to ten minutes a day. The teacher presses “play” on the next practice in the sequence and joins the daily classroom practice with students.
    - 'The result, measured again and again in controlled trials: classrooms get calmer. Behavior referrals drop. Grades rise. Teachers report less stress. Students report less stress. Not because anyone was taught to behave differently — because their biology changed.'
    - You wouldn't build a house on sand and wonder why the walls keep cracking. It's a biological problem. This is the biological solution.
  pullQuoteHtml: Daily mindful practice rewires those networks, <em>measurably, day by&nbsp;day.</em>
missingLayer:
  label: The missing layer
  headingHtml: <span class="stk sans">The curriculum works.</span><span class="stk">The brain it lands on <em>isn't&nbsp;ready.</em></span>
  paragraphs:
    - 'Districts have done the work. New reading curricula grounded in research. Math intervention. Tutoring. MTSS. Behavior systems. Resilience and life skills. All of it is well designed and led by people who care. And all of it quietly assumes one thing: that the child in the chair is neurologically ready to learn. Two of three of them aren''t.'
    - A science-of-reading lesson can't reach a prefrontal cortex that's offline. A behavior plan can't regulate a nervous system stuck in fight-or-flight. The missing piece isn't a better program or better instruction. It's the biological foundation that lets every other program finally work.
    - That's what five minutes a day builds. Not another initiative. The readiness underneath all of them.
  pullQuoteHtml: You wouldn't build a house on sand and wonder why the walls keep cracking. It's a biological problem. <em>It needs a biological&nbsp;solution.</em>
