title:
  lead: Transforming Student Behavioral Challenges
  emph: Through Mindfulness at the Webb School in the Valley
lead: The Webb School in the Valley, along with The Webb School at Cheshire, and The Grace S. Webb School
  in Hartford are part of the Institute of Living in Hartford, Connecticut. The focus of these schools
  is to help students with mental health challenges realize their potential and become self-regulated
  in a safe, supportive, and respectful environment.
