- type: heading
  id: preventative
  text: Mindfulness-Based Social Emotional Learning (MBSEL) as a preventative measure
- type: paragraphs
  items:
  - The Webb School in the Valley recognized that behavioral issues in the classroom can often lead to
    lifelong challenges. Students who are suspended or expelled from school are shown to have higher dropout
    rates and feel disconnected from their school community; often contributing to the school-to-prison
    pipeline and the achievement gap.
  - Young students who are expelled or suspended are as much as 10 times more likely to drop out of high
    school, experience academic failure and grade retention, hold negative school attitudes, and face
    incarceration than those who are not.
  - Suspension and expulsion deny the fact that these students may be experiencing trauma and require
    support; this ultimately prevents students from receiving the help that they need to create lasting
    positive change in their lives and keep them stuck in a repetitive cycle.
- type: quote
  text: Children and young adults today are experiencing more stress, anxiety, and trauma than ever before.
    Trauma and stress negatively impact brain function and often lead to impulsive, behavioral outbursts;
    as a result, they may find themselves entangled in the juvenile justice system. Students need tools
    that will help them slow down, make better choices, and avoid acting out of anger. Mindfulness is
    a practice that teaches individuals to do just that. Through mindfulness, children learn skills such
    as self-awareness and self-control, which allows them to avoid the pitfalls of impulsive behavior.
    As a juvenile judge, I work with some of the most troubled youth in America – *if we can teach them
    (and all students) to practice mindfulness, they will have a better chance to be successful, law-abiding
    citizens.*
  name: Judge Frank Szymanski
  role: Third Circuit Court, Juvenile Division
  initials: JF
- type: paragraphs
  items:
  - A single in-school suspension is predictive of a significant risk for academic failure (greater than
    25% chance of failure) on a state-wide standardized test.
  - Mindfulness-Based Social Emotional Learning (MBSEL) acts as a preventative measure by teaching the
    core competencies of self-awareness, social awareness, responsible decision making, self-management,
    and relationship skills of cooperation and communication.
- type: subheading
  text: 'MBSEL programs work to:'
- type: checklist
  items:
  - Reduce the biological effects of stress, which decreases fight/flight/freeze reactivity.
  - De-escalate conflict through self-regulation.
  - Aid in executive functioning and higher-order thinking, which promotes mindful listening and speech.
  - Develop empathy, compassion, and resilience.
- type: heading
  id: implementation
  text: MBSEL implementation
- type: paragraphs
  items:
  - Educators at The Webb Schools utilize the relational model, a strengths-based program, as well as
    trauma-informed teaching methods – which provided a strong foundation for introducing Inner Explorer
    MBSEL programs in the classroom. When implementing Inner Explorer, they came up with several helpful
    strategies that ensured the program was a success for their students.
- type: steps
  items:
  - title: Structure
    text: Giving students a set routine and consistency with their practice was a priority. Inner Explorer
      was incorporated at the same time each day in every classroom. This allowed both students and teachers
      the opportunity to practice mindfulness together – setting the stage for a productive day of learning
      and improved academic outcomes.
  - title: Adaptation
    text: With a little creative thinking, The Webb School in the Valley adapted Inner Explorer for students
      who initially found it difficult to sit still with their thoughts. Educators were encouraged to
      work with students to find a strategy that allowed them to participate in the Inner Explorer practices.
      For example, a student may draw or color while they listen to the daily mindfulness practice.
  - title: Support
    text: When a student is resistant to participate in mindfulness practice, educators work with them
      to understand the underlying reason. They also work to establish the “why” for students to help
      them make sense of the exercises they learn in class.
  - title: Application
    text: The Webb School Programs remind students to utilize the mindfulness techniques they are learning
      throughout the day, whether that be during the school day or otherwise. This encourages success
      both in and out of the classroom. One example teachers use to instill this ‘best practice’ is by
      writing the mindfulness technique that they are practicing with Inner Explorer on the board each
      day, such as belly breathing or a body scan exercise; then, if a student is having a difficult moment
      during the day, the teacher can refer back to the mindfulness technique written on the board as
      a way to help the student cope. For older students who may have access to technology such as smartphones
      and headphones, teachers encourage students to listen to a mindfulness practice through their devices
      during moments where they feel anxious, stressed, or overwhelmed.
- type: paragraphs
  items:
  - By setting up a strong foundation for daily mindfulness practice with Inner Explorer, The Webb School
    in the Valley continued using the program throughout remote learning during COVID-19. When they returned
    to in-person learning, restraint and seclusion numbers remained low; daily mindfulness helped students
    cope with the unprecedented challenges and stress of the pandemic.
