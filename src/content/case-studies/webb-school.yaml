body:
- type: heading
  id: background
  text: Background
- type: paragraphs
  items:
  - In working through student challenges, The Webb School in the Valley recognized a need for a support
    system that could translate beyond the classroom. Rather than trying to change behavior through external
    factors, such as a point and level system, staff aimed to transition towards transforming behavior
    from the inside out through social-emotional learning and the development of coping strategies.
  - This new approach included integrating daily mindfulness practice in the classroom. While some of
    the school counselors were already using mindfulness in isolated instances, School Administrator Jill
    DeVane knew that implementing a consistent practice for all students was the key to maximizing the
    benefits mindfulness has to offer. Inner Explorer programs offered the perfect solution – daily 5-10
    minute audio-guided mindfulness practices that required no prep work from educators. Through the generosity
    of the Aetna Foundation and LG Electronics, The Webb School in the Valley had the opportunity to pilot
    Inner Explorer programs at no cost.
- type: heading
  id: impact
  text: Impact
- type: paragraphs
  items:
  - After using Inner Explorer, The Webb School in the Valley reported a 65% decrease in restraints and
    seclusion.
  - Both The Webb School in the Valley and Inner Explorer recognize that oftentimes, it is not the curriculum
    that is a struggle for students, but rather, internal and external challenges that interfere with
    their ability to learn. By teaching Mindfulness-Based Social Emotional Learning (MBSEL) skills, students
    learn to process emotions, reduce chronic stress, and focus in school.
- type: quote
  text: There was one student in particular who suffered from extreme social anxiety – even being in a
    classroom of eight was a lot for him, but he did well with a small group or 1:1. In the year before
    using Inner Explorer, he had a significant number of outbursts (40+), resulting in restraint or seclusion.
    The change in behavior was so significant that his mother asked why she wasn't talking to us as much
    – the answer was that we had no behavior issues to review with her.
  name: Jill DeVane
  role: School Administrator, The Webb School in the Valley
  initials: JD
