- type: subheading
  text: Academic
- type: paragraphs
  items:
  - According to research by the Annie E. Casey Foundation, 3rd grade reading levels predict high school
    graduation rates.
  - At Henry J. Kaiser Elementary, after practicing mindfulness for a year, 48% of students were reading
    at grade level, compared to only 17% the prior year.
  - This means that 115 more students were on track to reach this important milestone.
- type: subheading
  text: Cost
- type: checklist
  items:
  - Saved approximately $11,500/year as 31% fewer students needed Reading interventions
  - Saved approximately $11,100/year as 30% fewer students needed Math interventions
