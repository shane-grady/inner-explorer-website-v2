      title: 'Daily MBSEL starts in every classroom'
      text: >-
        Funded by LG Electronics USA, educators and counselors add Inner Explorer's
        5–10 minute audio-guided practice to classrooms and small-group sessions,
        running it before or after each SEL lesson.
    - date: '2016–2018'
      tag: 'Growth'
      title: 'Academic gains run 3X the state average'
      text: >-
        Within two years of the first daily practice, Goddard's growth in students
        meeting or exceeding expectations runs 3X the Colorado average in English
        language arts and math, 5X in science, and 8X in 8th-grade English language
        arts.
    - date: '2018'
      tag: 'Recognition'
      title: 'The state calls'
      text: >-
        The Colorado Department of Education contacts Goddard's principal to ask what
        the school is doing. Goddard is outperforming most middle schools in the state
        with the same demographic profile, and the principal credits the daily
        mindfulness practice through Inner Explorer.
    - date: 'Today'
      tag: 'Sustain'
      title: 'The playbook stands'
      text: >-
        Goddard still serves grades 6–8 in Littleton today. LG's Experience Happiness
        funding carried the daily practice through the years this case study documents,
        and the four key findings from the rollout still hold up as a guide for any
        school community.

