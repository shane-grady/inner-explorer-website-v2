# /case-studies/goddard-middle-school page.
#
# Transferred from the legacy site (innerexplorer.com/case-study3) and its PDF
# ("How Goddard Middle School Gained State Recognition in Academics Through
# Mindfulness-Based Social Emotional Learning (MBSEL)", co-branded with LG
# Electronics USA "Experience Happiness"). All quotes, assessment figures, the
# funder, and implementation strategies are real source content. Items marked
# "REVIEW: representative" were written to fill the template (per content owner's
# direction) and need sign-off or real data before publish.
#
# Source notes: the legacy WEB page swaps two section headers relative to the PDF
# ("Modifications for a Unique Population" vs "Educating School Staff and
# Families"); this page follows the PDF's logical pairing. The 2016 start year is
# inferred from "within two years" + the 2016–2018 measurement window (REVIEW
# comments below). Entity facts verified by the 2026-06 research workflow: the
# 2016–2018 assessments were CMAS and "Met or Exceeded Expectations" is official
# CMAS ELA/math vocabulary (source 4); Goddard is part of Littleton Public Schools
# (source 5, NCES); the agency is the "Colorado Department of Education" (the
# legacy source's "Colorado State Department of Education" names no real agency);
# LG's initiative is "Life's Good: Experience Happiness" (source 3) — its support
# is stated period-bound because no 2024–2026 evidence confirms it continues.
#
# Photography: real photographs of Goddard Middle School supplied by the content
# owner (2026-09-16), replacing the AI-generated stand-in imagery this page shipped
# with. Six photos cover seven slots — the results band deliberately reuses the
# school exterior, which is the only repeat on the page. Alt text describes what each
# photo actually shows; none of them depict a mindfulness practice in progress, so no
# caption claims one. The two AI stand-in PORTRAITS were removed rather than swapped
# (no portrait exists in the supplied set), so both staff quotes now render as
# compact cards — see the note on `voices` below.
