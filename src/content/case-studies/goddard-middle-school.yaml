body:
- type: heading
  id: background
  text: Background
- type: quote
  text: We have a unique demographic where we have students who come from very poor families, and students
    who come from very wealthy families. Bringing all of these kids from different backgrounds together
    can raise issues. But *diversity is one thing that makes our school great.*
  name: Jenica Loether
  role: School Counselor, Goddard Middle School
  initials: JL
- type: paragraphs
  items:
  - Goddard implemented the Inner Explorer program at no cost through the generosity of LG Electronics
    USA. Both educators and counselors started using the program in classrooms and small group sessions.
    Within two years of using Inner Explorer, Goddard saw a substantial increase in school-wide academic
    performance. LG Electronics USA continues to support the use of Inner Explorer at Goddard Middle School
    today.
- type: callout
  title: State recognition
  text: The results were so significant that the Colorado State Department of Education contacted the
    school principal to find out what they were doing – Goddard was outperforming most middle schools
    in the state with the same demographic profile. The principal credited the results to practicing mindfulness
    through Inner Explorer.
- type: heading
  id: academics
  text: Rapid improvement in academics
- type: paragraphs
  items:
  - Between 2016 and 2018, the average percentage increase of Goddard 6th-8th grade students who met or
    exceeded expectations in English Language Arts and Math was 3X higher than the average percentage
    increase for Colorado as a whole. Science was 5X higher. Most notably, the percentage of students
    who met or exceeded expectations in 8th-grade English Language Arts was 8X higher than the state.
