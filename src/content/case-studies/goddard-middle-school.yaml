- type: paragraphs
  items:
  - Before Inner Explorer, staff at Goddard Middle School were already facilitating social emotional learning
    (SEL) lessons. After Inner Explorer was introduced, the focus shifted to incorporating Mindfulness-Based
    Social Emotional Learning (MBSEL) into every classroom to support student and educator well-being.
- type: subheading
  text: Why MBSEL?
- type: paragraphs
  items:
  - Traditional SEL curriculum is designed to activate the prefrontal cortex (PFC), otherwise known as
    the brain's executive center. However, *when the brain is stressed, the prefrontal cortex becomes
    inactive.*
  - As a result, a person is unable to access what they cognitively know, making them prone to reactivity.
    *MBSEL programs target this disconnect by teaching strategies to self-regulate during moments of stress.*
- type: heading
  id: modifications
  text: Modifications for a unique population
- type: paragraphs
  items:
  - Goddard began implementing 5-10 minutes of daily MBSEL practice through Inner Explorer, either before
    or after teaching a lesson on SEL. This allowed students to calm down and prepare for learning before
    the lesson, or enhance what they had just learned by reflecting on it during mindfulness.
  - Considering Goddard’s high percentage of students facing trauma and adversity, in addition to special
    education students, the school needed an approach that catered to their population. School staff worked
    together to brainstorm a strategy to integrate a mindfulness practice for these students in a way
    that was sensitive to their needs.
  - In situations where a student feels upset or has an emotional outburst, the teacher asks the student
    to sit in an area where they feel safe and listen to a mindfulness practice until they feel ready
    to talk about the situation. Students who feel uncomfortable closing their eyes or sitting still are
    encouraged to color or doodle while they listen to a mindfulness practice. As a result, teachers noticed
    that students were more calm and less reactive during the day.
- type: heading
  id: staff
  text: Educating school staff and families
- type: paragraphs
  items:
  - Goddard leadership ensured that school staff and families were knowledgeable about mindfulness and
    answered any questions they had about practicing Inner Explorer. They accomplished this by holding
    a presentation about MBSEL, discussing the research and benefits.
- type: subheading
  text: 'Key Findings from Goddard can help any school community integrate MBSEL:'
- type: checklist
  items:
  - Elect a champion who is dedicated to making the program a success.
  - Brainstorm how an MBSEL program can complement an existing program, such as SEL lessons. This will
    make the transition easier for students and educators.
  - Adapt the program to meet the needs of the students within the community.
  - Communicate the "why" and "how" of an MBSEL program to families, ensuring they have an opportunity
    to ask questions.
