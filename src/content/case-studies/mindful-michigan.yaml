- type: paragraphs
  items:
  - "Inner Explorer was [recently profiled](https://www.secondwavemedia.com/features/headstartmindfulness03072024.aspx) as a best practice for Head Start centers across Michigan, which could bring these practices to children even earlier in their lifespan."
- type: heading
  id: donors
  text: "Donor & foundation support"
- type: paragraphs
  items:
  - "While there was interest in our work, we did not raise the expected funds from Michigan-based foundations, even though the benefits were well documented. We did raise funds from national donors and national foundations, as well as from the growing number of schools and centers that pay for the program directly."
  - "Interestingly, in similar projects underway in Georgia and North Carolina, led by the GreenLight Fund, we have multiple additional foundations already signed on for these multi-year projects, including the Hearst Foundations, Annie E. Casey Foundation, Arthur M. Blank Foundation, and many others. GreenLight Fund has made these introductions and actively promotes the work, opening the door to like-minded foundations to engage with us. They also helped us connect with the University of Pennsylvania's Center for High Impact Philanthropy (CHIP), which included Inner Explorer in their most recent [High Impact Giving Toolkit](https://www.impact.upenn.edu/2024-high-impact-giving-toolkit/). We would be grateful for Fetzer Institute's help connecting with foundations interested in Michigan youth mental health, particularly now that we have demonstrated school-wide improvements."
- type: heading
  id: forecast
  text: "Future forecast"
- type: paragraphs
  items:
  - "We plan to share the multi-year impact of this work at a state-wide convening in late 2024 or early 2025. We will coordinate with the Fetzer Institute team on planning the convening, including advocacy for adopting daily mindfulness practice as a core part of the curriculum in all P-12 schools. This 'inside-out' learning approach is necessary for inner peace and self-love, which is the foundation for peace and love in communities."
  - "Mindful Michigan continues to be rigorously evaluated across multiple locations and multiple years. Using school-level data that is available publicly, we have shown that using Inner Explorer increases academic performance by 19.7% overall, is improving attendance and improving emotional well-being. Other key learnings from our journey together have given us the wisdom to go deeper, creating authentic and intentional relationships with students, families, and staff across Michigan and building community momentum and acceptance around daily mindfulness practice across the state."
  - "We plan to work with the Fetzer Institute to bring this daring yet simple vision of 'A Mindful Michigan' to life."
- type: heading
  id: appendices
  text: "Appendices"
- type: subheading
  text: "Deepening | State-wide roundtables"
- type: paragraphs
  items:
  - "*Insights into our why*\nDeepening our Collective Journey as Education Leaders"
  - "Our first quarterly Experiential Roundtable which had 8 education leaders across Michigan in attendance exploring their mindful \"why\" together. The Roundtables are a strategy to deepen engagement and a collective sense of community for contemplative education leaders across the State of Michigan."
  - "*Connecting moments to movements*\nBuilding Community for Mindful Michigan Education Leaders"
  - "A partnership with the Fetzer Institute, Student Advocacy Center, and Southfield Public Schools co-sponsored our second experiential roundtable. The focus of this roundtable was on \"Connecting Moments to Movements\" and brought together over 40 education leaders across Michigan including representation from school-communities across the state, foundations, MPTA, OST's ACCESS and Wayne Metro, policy and business leaders, and more."
  - "*IN-SPIRE: Story Quest*\nAn Inspirational Community Building Event"
  - "The \"IN-SPIRE\" Story Quest Competition and Roundtable was an innovative deepening strategy to inspire an appreciative, creative, and reflective process to further the commitment to mindful daily practice. We had over 40 applicants from across the state of Michigan (both Students and Educators)."
  - "The third roundtable of the year was attended by 35+ education leaders across the state and featured the winners of the story quest as an inspirational event to build engagement state-wide across Michigan. All of our 3 student winners shared their inspiring stories about Inner Explorer and our winning educator shared her powerful poem about the impact of Inner Explorer on her students and herself/her family."
- type: subheading
  text: "Deepening | District, state and school-wide challenges"
- type: paragraphs
  items:
  - "From state-wide challenges, to district level, and to school level, we found creative ways to increase engagement and create a mindful school-community culture. In our Southfield District-wide Winter Challenge, Adler Elementary got their entire staff practicing mindfulness daily and sustained a 300% increase in engagement to win the challenge! Fortis Academy got their entire school practicing mindfulness daily off the momentum of their March Mindful Madness Competition!"
- type: subheading
  text: "Growing Mindful Michigan"
- type: paragraphs
  items:
  - "*Conference*\nBringing Presence and Connection"
  - "I presented at the Student Mental Health Summit in Lansing and for their virtual conference with Southfield. I also presented at the Michigan Afterschool Association with ACCESS and the MIPTA conference."
  - "*Data and evaluation*\nPursuing Evidence-Based Research"
  - "I held data review meetings with our biggest Michigan stakeholders including Southfield, Wayne Metro, ACCESS and NHA."
  - "We also did a Spring pre and post evaluation of Southfield, ACCESS, and Wayne Metro that we are working with MSU to finalize impact data."
  - "*New sites*\nCreating Growth"
  - "*Juvenile Justice and Foster Care*\nDickerson Juvenile Justice Center\nChildren's Village Juvenile Justice Center\nWe Care Foster Care"
  - "*Expanding in OST's*\n6 New Wayne Metro Sites\n6 New ACCESS Sites"
  - "*New Schools and Districts*\nWayne Westland Community School District (10)\nFreeland Community School District (2)\nSouth Pointe Scholars\nEndeavor Charter Academy\nTaylor Exemplary Academy\nPioneer Middle School\nGreat Lakes Learning Academy\nAngell Elementary\nL'Anse Creuse High School\nDwight Rich School of the Arts\nNorth Muskegon High School\nWest Middle School, Grand Blanc\nMonroe YMCA\nKent Intermediate School District\nCornerstone Charter\nUM Children's Hospital"
  - "*New partner potential*\nCreating Collaboration\nCoalition of Schools Educating Mindfully, Michigan Virtual, Student Advocacy Center of Michigan, Michigan PTA, Launch Michigan."
