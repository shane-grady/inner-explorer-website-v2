body:
- type: paragraphs
  items:
  - "As you know, stress blocks thinking, learning, and relating. This multi-directional model attenuates stress as the first and necessary step that improves mental health, academic achievement, school safety, and family engagement. The theory is that we must address biology before behavior, meaning reducing the effects of stress before expecting the responsive expression."
- type: steps
  title: "The six parts of the Mindful Michigan Model"
  items:
  - title: "Foundational daily mindful practice"
    text: "Provides 180 days of sequenced, 10-min audio guided practice. Easy to use with transition responsive practices that together promote wellbeing, academic achievement and school safety."
  - title: "Intergenerational approach"
    text: "Links home and school for family engagement and transparency."
  - title: "Intentional equity and inclusion"
    text: "Includes youth in juvenile justice, early learning centers, OST centers, foster care, and children’s hospitals. Also available in English and Spanish."
  - title: "Collaboration and collective impact"
    text: "Creates a collaborative leadership space supported by public and private partnerships for education leaders to work together."
  - title: "Data-driven research"
    text: "Provides evidence-based and meaningful impact focus for real-time data and wise decision making."
  - title: "Inspired innovation"
    text: "Elevates innovative ideas in mental health including: Riverfront Reflections, Extreme Makeover Mindful Edition, and Experiential Roundtables."
- type: paragraphs
  items:
  - "The Mindful Michigan Model is the first-of-its-kind state-wide model for a mindful theory of system change and it is only possible with our funders and partners! Fetzer Institute, The Skillman Foundation, Hemera Foundation, MC4ME, Millennium Forum."
- type: heading
  id: reach
  text: "Total schools, students, and educators impacted"
- type: paragraphs
  items:
  - "In the grant's first two years, we reached 202 and 146 schools/centers, respectively, impacting approximately 58,000 students and their families and 2300 educators. We have illuminated our commitment to equity by deepening our partnerships with School Districts, Charter Networks, Foster Care Group Homes, \"Out-of-School Time\" (OST) Providers, Park Districts, Juvenile Detention Centers, and Families."
  - "We are inspired that Southfield has become a model Mindful District, the first in the nation to require daily mindful practice with Inner Explorer for their students and staff including the administration, bus drivers, janitors, and office staff. They have also embedded training from MC4ME, Millennium Forum, and Breathe for Change, reaching nearly 200 educators as a way for them to deepen their understanding of and commitment to mindfulness. As a result of this work, Michigan schools have been transformed as our partnerships have grown."
- type: heading
  id: academic
  text: "Academic impact"
- type: paragraphs
  items:
  - "As noted, it was challenging for the researcher to get school-level data by student and classroom. As a result, an analysis was done using state-wide academic and attendance data that is public record, comparing schools in Michigan using Inner Explorer consistently, with \"peer schools\", those with the same demographic profile, not using Inner Explorer."
  - "The results, comparing the 2022-23 school year to 2021-22, showed that schools using Inner Explorer achieved 19.7% higher academic achievement and a 1.64% improvement in attendance compared to peer schools. While these schools were underperforming the peer schools before they adopted Inner Explorer, they are now making significant gains compared to schools that did not adopt Inner Explorer."
- type: table
  caption: "Proficiency and attendance, Inner Explorer schools vs. peer schools"
  columns: [Category, Proficiency, Attendance]
  rows:
  - ["Top Inner Explorer Schools: 2022-2023 School Year", "24.13", "53.75"]
  - ["Top Inner Explorer Schools: 2021-2022 School Year", "20.15", "45.51"]
  - ["% Change", "19.71%", "18.11%"]
  - ["Non-Inner Explorer Schools: 2022-2023 School Year", "29.97", "63.18"]
  - ["Non-Inner Explorer Schools: 2021-2022 School Year", "29.96", "54.24"]
  - ["% Change", "0.01%", "16.47%"]
- type: paragraphs
  items:
  - "For example, NHA is a 100-school charter network with 50 schools in Michigan. Their first school to use Inner Explorer was Fortis Academy in Ypsi. They were high users in the 2021-22 school year and the 2022-23 school year. They achieved over 30% improvement in proficiency in these two years. This shows that cumulative gains can continue each year the program is used."
  - "Fortis embraced mindfulness school-wide with various deepening initiatives throughout the year including innovative challenges like Mindful March Madness. They have embraced it school-wide, experienced improved academic results, and zero behavior issues! Many other NHA schools have followed Fortis' success with Inner Explorer and embedded it in their budget this year."
- type: heading
  id: community
  text: "Community deepening and collaboration"
- type: paragraphs
  items:
  - "Our strategy has been to build a community of practice, inspire and sustain daily habits, and encourage deeper engagement through partners including Millennium Forum and MC4ME. With innovative roundtables and events, we have brought together our Mindful Michigan community, including new collaborators because this movement is more significant than any one organization. These efforts are already delivering a collective impact."
  - "Southfield Public Schools, with the visionary leadership of Paula Lightsey, is showing what this community deepening and collaboration look like at the district level. Paula has inspired the whole district to embed daily mindful practice and to support all staff including bus drivers, janitors, secretaries, and district administrators. This is a model district for the state and country. The usage of Inner Explorer has steadily increased over her tenure and this past year has risen by 800% as students, staff, and families joined the daily mindful practice. A multi-year evaluation on impact across measures is in process."
  - "We are inspired this year to see our youth leading the movement - from an Inner Explorer youth opening the Coalition of Schools Educating Mindfully (COSEM) Conference to our entirely new elementary series featuring youth-led practices, to our student winners from across Michigan of our IN-SPIRE story event sharing how mindfulness is transforming their lives at school, at home, and beyond."
  - "We held three state-wide roundtable convenings to unite Michigan's education leaders in sacred community. This deepened our “why” for this work, connected Mindful Moments to Movements, and our InSpire Story Quest event brought together Mindful Michigan education leaders, students, partners, and policymakers nationwide. These virtual gatherings and convenings have fostered Mindful Michigan as a growing community of youth, families, educators, and education leaders all practicing together. This is what Mindful Michigan is all about!"
- type: figure
  image:
    src: ../../assets/images/case-studies/mindful-michigan/smiling-student.jpg
    alt: A smiling student rests her head on her arms with her eyes closed during a mindfulness practice
  caption: A student smiles during her daily mindfulness practice with Inner Explorer.
- type: heading
  id: policy
  text: "Policy and advocacy"
- type: paragraphs
  items:
  - "The CDC recently issued six recommendations for school administrators to address the youth mental health crisis which is a significant factor linked to academic failure. Daily mindfulness practice was #2 (ahead of SEL) and mindfulness training for teachers was #6! The US Surgeon General also promotes mindfulness to improve well-being and decrease loneliness. The [US Department of Education](https://eric.ed.gov/?id=ED606075) and the [American Academy of Pediatrics](https://publications.aap.org/aapnews/news/11995/Mindfulness-a-Natural-Fit-for-Pediatric-Practice?autologincheck=redirected) also recommend mindfulness. Educators from across the country and certainly in Michigan would benefit from tuning in to this excellent guidance."
  - "The [recent NPR story highlighted Inner Explorer](https://www.npr.org/sections/health-shots/2024/01/26/1227056527/to-help-these-school-kids-deal-with-trauma-mindfulness-lessons-over-the-loudspea) as a proven path to bring daily mindfulness practice to schools in an easy-to-implement and highly effective way. While Patricia Sullivan Elementary School, profiled in the NPR story with their results noted below, has excellent leadership and staff, their results are unmistakable compared to their district, state, and nation. More than 80% of the children at Sullivan are unhoused and still, as a Title 1 school went from an 'F' to an 'A' using Inner Explorer daily. While education results have been primarily flat for nearly 50 years, and sadly most US children are below grade level, this chart offers hope that we can change the trajectory within five years! We simply need the commitment Southfield, NHA, and many others are following - every student, every day."
