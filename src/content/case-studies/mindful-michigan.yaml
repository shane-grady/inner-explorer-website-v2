- type: paragraphs
  items:
  - "Our capacity to reach all Michigan's children and families requires us to be strategic. Our initial strategy for year 1 was to follow tipping point science to grow throughout the state and we successfully had over 200 schools and sites get started. However, not all of them fully engage with the Inner Explorer platform, even when offered for free through grant funding. Southfield is showing what it looks like for all students, staff, and families to practice mindfulness embedded into the school day and a component for teacher support and impact."
  - "Southfield Public Schools are uniquely positioned to be our model district for the Mindful Michigan Model and increase engagement across the state district by district."
- type: steps
  items:
  - title: "People and commitment"
    text: "The leadership is there and the district just invested in a 3-year subscription to Inner Explorer. The district has had its leaders trained by MC4ME, trained ten leaders in 'Breathe for Change', and has 16 new leaders in our Millennium Forum groups that started in January."
  - title: "Equity"
    text: "Southfield is a medium-sized diverse district. They have 14 schools with over 5,000 students, 98% minority enrollment. They initially ranked in the bottom 50%, with 20% math proficiency, and 36% reading proficiency.* *Source National Center for Education Statistics (NCES) MI Dept of Education"
  - title: "Vision and innovation"
    text: "Southfield is innovative in thinking about learning from the inside out and has the right people, commitment, and drive to pilot our inside-out model for the state and beyond."
- type: heading
  id: anecdotes
  text: "Anecdotes from students and staff on Mindful Michigan"
- type: paragraphs
  items:
  - "\"I am grateful for all the people in the world\"\nKindergartener at Detroit Leadership Academy"
  - "\"When I know that I need mindfulness is when I have mixed feelings, feeling mad, sad, angry, uncomfortable, you can use mindfulness for all of these situations. If I were you and had a problem, the best place to go is to Inner Explorer\".\nGabrielle Gross, Southfield Adler Student\n1st Place In-Spire Story Champion"
  - "\"After doing these mindful practices for about a month and a half straight (still counting), It has helped me to feel physically strong and emotionally replenished.\"\nElaine Sandouno, Fortis Student\n2nd Place In-Spire Story Champion"
  - "\"Whenever I feel tired or in a bad mood, I make sure to practice taking deep breaths to calm myself down and let myself have enough time to make decisions. Inner Explorer has given me chances to avoid conflicts and has helped me in a positive way.\"\nIsraa Abella, Fortis Student\n3rd Place In-Spire Story Champion"
  - "\"While reading my students' Inner Explorer essays, I was blown away by some of their insights. Inner Explorer has not only helped me to have more compassion for myself, but to be more compassionate to those around me: my students, coworkers, friends, and family.\"\nMarc Zendejas, Educator"
  - "\"The best tool in my toolbox is mindfulness. Inner Explorer helps our school find a calmness in the present moment and connects us to each other.\"\nPamela Mckenzie, Behavior Interventionist"
