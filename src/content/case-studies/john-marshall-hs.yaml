- type: paragraphs
  items:
  - Inner Explorer, Be Strong, the Collaborative for Academic, Social, and Emotional Learning (CASEL),
    Discovery Education, and the Greater Good Science Center are partners in bringing happiness to 5.5
    million teens in the United States as part of the LG Electronics USA Experience Happiness Initiative.
