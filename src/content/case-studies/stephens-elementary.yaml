faq:
  title: Frequently Asked Questions
  items:
  - q: How did Stephens Elementary reduce office referrals?
    a: Stephens added Inner Explorer's daily mindfulness practice to every classroom in the 2025-26
      school year. Each practice takes about ten minutes. In the first seven months, office referrals
      fell 50% compared to the prior year, and the school made no other changes to its discipline approach.
  - q: How much time does Inner Explorer take each day?
    a: Practices run 5 to 10 minutes. At Stephens, teachers use about ten minutes a day. Every practice
      is audio guided, so there is no lesson to prepare or lead.
  - q: Can a daily mindfulness practice improve test scores?
    a: At Stephens, proficiency on Alabama's state assessment rose 33% in math and 24% in English in
      the year students practiced daily, compared to statewide gains of 2.7% and 1.6%. Results from
      a single school are correlational. Inner Explorer's peer-reviewed research, including a 2016
      controlled study, found 15% higher GPA among students who practiced daily.
  - q: How did Stephens Elementary start using Inner Explorer?
    a: Dr. Eric Tyler, a pediatrician at Pediatric Associates of Alexander City, connected the school
      to Inner Explorer. He and Principal Lekishia Richardson worked together to identify what students
      needed and chose a daily mindfulness practice.
  - q: Does Inner Explorer work in Title I schools?
    a: Yes. Stephens is a Title I school, and 78% of Inner Explorer's partner districts are majority
      Title I. Practices are audio guided and need no prep, so the program fits into a school day without
      adding work for teachers.
