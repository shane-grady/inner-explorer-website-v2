faq:
  title: Frequently Asked Questions
  items:
  - q: How did Stephens Elementary reduce office referrals?
    a: Stephens added daily mindfulness to every classroom in 2025-26. Office referrals fell 50% in
      the first seven months, with no other change to its discipline approach.
  - q: How much time does Inner Explorer take each day?
    a: 5 to 10 minutes. Every practice is audio guided, so there is nothing for teachers to prepare.
  - q: Can a daily mindfulness practice improve test scores?
    a: At Stephens, state assessment proficiency rose 33% in math and 24% in reading in the year students
      practiced daily. A single school's results are correlational, but a 2016 controlled study found
      15% higher GPA among students who practiced daily.
  - q: How did Stephens Elementary start using Inner Explorer?
    a: Local pediatrician Dr. Eric Tyler brought it to the school and worked with Principal Lekishia
      Richardson to launch daily practice in August 2025.
  - q: Does Inner Explorer work in Title I schools?
    a: Yes. Stephens is Title I, and 78% of Inner Explorer's partner districts are majority Title I.
      With no prep required, it fits the school day without adding work for teachers.
