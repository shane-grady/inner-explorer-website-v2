body:
- type: heading
  id: quick-read
  text: The Quick Read
- type: checklist
  items:
  - lead: 'Challenge:'
    text: Third and fourth graders at a Title I elementary school in rural Alabama had a full day of
      academics and few tools for handling stress and big emotions.
  - lead: 'Solution:'
    text: 5-10 minutes of daily audio-guided mindfulness in every classroom, introduced through a local
      pediatrician.
  - lead: 'Outcome:'
    text: 50% fewer office referrals in seven months, gains in math and English proficiency, more regulated
      students ready to learn.
- type: video
- type: heading
  id: challenge
  text: 'The Challenge: Students Had Few Tools for Big Emotions'
- type: paragraphs
  items:
  - N.H. Stephens Elementary serves about 440 third and fourth graders in Alexander City, Alabama.
    Like a lot of kids today, they spend their days surrounded by constant stimulation. Very little
    of the school day showed them what to do when it all became too much.
  - Fourth grade reading teacher Brandy George saw it early in her career.
- type: quote
  text: Within my first years of teaching, I did notice a gap. I am feeding these children all of these
    academic things, but I'm not giving them anything that's helping them regulate emotionally.
  name: Brandy George
  role: 4th Grade Reading Teacher
- type: paragraphs
  items:
  - A rough morning at home, a big test, or the energy of coming in from PE could throw a student
    off for the rest of the day. Principal Lekishia Richardson wanted students to have coping strategies
    they could reach for on their own, before a hard moment turned into a trip to the office.
- type: heading
  id: solution
  text: 'The Solution: A Local Pediatrician Brought Daily Mindfulness to Stephens Elementary'
- type: paragraphs
  items:
  - The idea started outside the school. Dr. Eric Tyler has been a general pediatrician in Alexander
    City for 45 years. In a letter about the program, he writes about how social media and gaming
    pull at children’s attention, and how caregivers are often too short on time to give kids the
    support they need.
  - He learned about Inner Explorer in 2024 and brought it to Stephens Elementary himself. He and Principal
    Lekishia Richardson looked at what students needed for their mental health, and daily practice
    began in every classroom in August 2025.
- type: quote
  text: We collaborated to see what was the need for the students when it comes to their mental health.
    And so what we decided to do was implement the program to make sure that our students have the
    coping strategies that they need.
  name: Lekishia Richardson
  role: Principal
- type: quote
  text: One year in, it has changed the culture of a school from Chaos to Calmness, allowing for a culture
    that promotes learning, starting with the mastery of one’s own thoughts and feelings for students
    and teachers alike.
  name: Eric Tyler, M.D.
  role: Pediatric Associates of Alexander City
- type: paragraphs
  items:
  - He now wants every child in Alabama to have the same access, and he calls it “my mission throughout
    the remainder of my career.”
- type: subheading
  text: 5-10 minutes, built into every school day
- type: paragraphs
  items:
  - Leadership made daily practice an expectation in every classroom. Each practice is audio guided
    and takes about 5-10 minutes, so teachers don't plan a lesson or lead the session themselves.
  - 'Fourth grade math teacher Rachel Smith describes what students do: breathing techniques, head
    to toe body scans, and time to practice being comfortably quiet. *"It''s great to practice just
    having to sit and do things that they don''t get to do every day anymore, in this world of constant
    stimulation and constant input."*'
- type: figure
  image:
    src: ../../assets/images/case-studies/stephens-elementary/student-practice-eyes-closed.jpg
    alt: A Stephens Elementary student sits with her eyes closed during a daily mindfulness practice
- type: subheading
  text: Used when students need it most
- type: paragraphs
  items:
  - In addition to the daily practices, teachers use *transitional practices* at the points in the
    day when emotions tend to run high, like before a test, right after PE, or any time the normal
    routine gets disrupted.
- type: quote
  text: We are using mindfulness before tests, after PE, and just having a moment to breathe and settle
    into the room and settle back into learning.
  name: Cora Blue
  role: 3rd Grade Math Teacher
- type: quote
  text: It was extremely easy to implement this into our schedule because it only takes 10 minutes.
  name: Brandy George
  role: 4th Grade Reading Teacher
- type: heading
  id: outcome
  text: 'The Outcome: Half as Many Office Referrals'
- type: subheading
  text: Fewer students sent to the office
- type: paragraphs
  items:
  - In the first seven months of the 2025-26 school year, Stephens had 50% fewer office referrals
    than the year before. Principal Richardson and her team looked at the data from every angle before
    drawing a conclusion.
- type: quote
  text: The past seven months, we had 50% less office referrals compared to last school year, and
    the only thing we've changed as far as discipline goals is implementing Inner Explorer.
  name: Lekishia Richardson
  role: Principal
- type: note
  text: The 50% figure covers the first seven months of the school year, as reported by Principal Richardson.
    Full-year school discipline records show a 48% reduction.
- type: subheading
  text: Gains in math and English
- type: paragraphs
  items:
  - "Stephens students also posted gains on Alabama's state assessment: a 33% gain in math proficiency\
    \ and a 24% gain in English proficiency. Teachers say the daily practice helps students settle\
    \ and turn their attention back to the work in front of them."
- type: subheading
  text: State Assessment Increases
- type: paragraphs
  items:
  - 3rd grade reading scores for state assessment jumped from 86% to 92%.
- type: stats
  items:
  - value: 86%
    label: Before
  - value: 92%
    label: After
- type: figure
  image:
    src: ../../assets/images/case-studies/stephens-elementary/student-at-desk.jpg
    alt: A Stephens Elementary student in glasses works on an assignment at his desk
- type: subheading
  text: Students who can pause and reset
- type: paragraphs
  items:
  - School counselor Tabetha Blankenship sees the change in how students handle their own emotions.
- type: quote
  text: When they get upset, they don't fly off the handle or lose control. They're better able to
    pause and work it out within themselves. Their self-awareness has really increased.
  name: Tabetha Blankenship
  role: School Counselor
- type: figure
  image:
    src: ../../assets/images/case-studies/stephens-elementary/student-hand-on-heart.jpg
    alt: A Stephens Elementary student sits at his desk with one hand resting on his chest during a
      practice
- type: subheading
  text: Skills that go home with them
- type: paragraphs
  items:
  - Third grade math teacher Cora Blue says students are using what they learn "not only in school but in
    their day to day lives."
  - Students say the same thing in their own words. *"If I wake up on the wrong side of the bed, it helps
    me and it calms me down. It helps me get my mind straight and get ready for the day."*
- type: paragraphs
  items:
  - One conversation between a local pediatrician and a principal gave Stephens students a few minutes
    of calm every day. Within one school year, students had tools to reset on their own, and office
    referrals had dropped by about half.
- type: quote
  variant: closing
  text: It has assisted with discipline, it's helped with our academics as well. And so we felt like
    it was something that we needed to implement to make sure that our students are successful throughout
    the day.
  name: Lekishia Richardson
  role: Principal, N.H. Stephens Elementary School
