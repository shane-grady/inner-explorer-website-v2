          icon: [list]
        preview:
          text: [{ key: title }, Step]
          icon: [list]
        value:
          title: ''
          content: ''
          contentHtml: ''
        _inputs:
          content:
            type: textarea
          contentHtml:
            type: html
            options: *inline_html_options
  card_items:
    style: modal
    values:
      - label: Card
        icon: article
        picker_preview:
          text: [Card]
          icon: [article]
        preview:
          text: [{ key: title }, Card]
          icon: [article]
        value:
          badge: ''
          title: ''
          content: ''
        _inputs:
          content:
            type: textarea

_snippets:
  pull_quote:
