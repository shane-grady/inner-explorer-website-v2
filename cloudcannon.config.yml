_snippets:
  pull_quote:
    template: mdx_paired_component
    inline: false
    preview:
      text: [{ key: cite }, Pull quote]
      icon: format_quote
    picker_preview:
      text: [Pull quote]
      icon: [format_quote]
    definitions:
      component_name: PullQuote
      content_key: quote_text
      named_args:
        - editor_key: cite
          type: string
          optional: true
          remove_empty: true
  figure:
    template: mdx_component
    inline: false
    preview:
      text: [{ key: alt }, Figure]
      icon: image
    picker_preview:
      text: [Figure]
      icon: [image]
    definitions:
      component_name: Figure
      named_args:
        - editor_key: src
          type: string
        - editor_key: alt
          type: string
        - editor_key: caption
          type: string
          optional: true
          remove_empty: true
    _inputs:
      src: *optimized_image
      caption:
        type: textarea
  stat_row:
    template: mdx_component
    inline: false
    preview:
      text: [Statistics]
      icon: monitoring
    picker_preview:
      text: [Statistics]
      icon: [monitoring]
    definitions:
      component_name: StatRow
      named_args:
        - editor_key: stats
          type: array
        - editor_key: ariaLabel
          type: string
          optional: true
          remove_empty: true
    _inputs:
      stats:
        type: array
        options:
          structures: _structures.stat_row_items
  resource_card:
    template: mdx_component
    inline: false
    preview:
      text: [{ key: title }, Resource]
      icon: article
    picker_preview:
      text: [Resource card]
      icon: [article]
    definitions:
      component_name: ResourceCard
      named_args:
        - editor_key: title
          type: string
        - editor_key: meta
          type: string
          optional: true
          remove_empty: true
        - editor_key: href
          type: string
          optional: true
          remove_empty: true
        - editor_key: eyebrow
          type: string
          optional: true
          remove_empty: true
        - editor_key: cta
          type: string
          optional: true
          remove_empty: true
  audio_practice:
    template: mdx_component
    inline: false
    preview:
      text: [{ key: title }, Audio practice]
      icon: headphones
    picker_preview:
      text: [Audio practice]
      icon: [headphones]
    definitions:
      component_name: AudioPractice
      named_args:
        - editor_key: audioSrc
          type: string
        - editor_key: durationSec
          type: number
        - editor_key: title
          type: string
        - editor_key: eyebrow
          type: string
          optional: true
          remove_empty: true
        - editor_key: transcriptHref
          type: string
          optional: true
          remove_empty: true
        - editor_key: captionsSrc
          type: string
          optional: true
          remove_empty: true
  callout:
    template: mdx_paired_component
    inline: false
    preview:
      text: [{ key: label }, Callout]
      icon: info
    picker_preview:
      text: [Callout]
      icon: [info]
    definitions:
      component_name: Callout
      content_key: callout_content
      named_args:
        # `optional: true` matters for MATCHING, not just for validation: a named_arg
        # without it must be present in the markup or CloudCannon fails to match the
        # snippet and shows "cannot be edited — Unexpected element". A `default` does
        # NOT make an arg optional. Callout.astro defaults `type` to 'tip', so the two
        # usages that omit it (privacy-policy.mdx, signing-in.mdx) render correctly but
        # were uneditable until this was marked optional.
        - editor_key: type
          type: string
          default: tip
          optional: true
          allowed_values: [tip, note, good]
        - editor_key: label
          type: string
          optional: true
          remove_empty: true
        # Callout.astro also accepts `heading`, which promotes the aside from a quiet
        # note to a signposted one. It was missing here, so every `<Callout heading=…>`
        # was unmatched and the editor showed "<callout> cannot be edited — Unexpected
        # element" instead of the snippet.
        - editor_key: heading
          type: string
          optional: true
          remove_empty: true
    _inputs:
      type:
        type: select
        options:
          values: [tip, note, good]
      heading:
        type: text
        comment: Optional. Replaces the small eyebrow with a sentence-case heading.
  help_figure:
    template: mdx_component
    inline: false
    preview:
      text: [{ key: label }, Help figure]
      icon: image
    picker_preview:
      text: [Help figure]
      icon: [image]
    definitions:
      component_name: HelpFigure
      named_args:
        - editor_key: label
          type: string
        - editor_key: caption
          type: string
          optional: true
          remove_empty: true
        - editor_key: ratio
          type: string
          optional: true
          default: 16 / 9
          remove_empty: true
        - editor_key: src
          type: string
          optional: true
          remove_empty: true
        - editor_key: alt
          type: string
          optional: true
          remove_empty: true
    _inputs:
      src: *optimized_image
      ratio:
        type: select
        options:
          values: [16 / 9, 4 / 3, 1 / 1]
  help_table:
    template: mdx_paired_component
    inline: false
    preview:
      text: [{ key: label }, Help table]
      icon: table_chart
    picker_preview:
      text: [Help table]
      icon: [table_chart]
    definitions:
      component_name: HelpTable
      content_key: table_markdown
      named_args:
        - editor_key: label
          type: string
          optional: true
          remove_empty: true
  help_video:
    template: mdx_component
    inline: false
    preview:
      text: [{ key: label }, Help video]
      icon: play_circle
    picker_preview:
      text: [Help video]
      icon: [play_circle]
    definitions:
      component_name: HelpVideo
      named_args:
        - editor_key: label
          type: string
        - editor_key: caption
          type: string
          optional: true
          remove_empty: true
        - editor_key: ratio
          type: string
          optional: true
          default: 16 / 9
          remove_empty: true
        - editor_key: src
          type: string
        - editor_key: webmSrc
          type: string
          optional: true
          remove_empty: true
        - editor_key: poster
          type: string
          optional: true
          remove_empty: true
    _inputs:
      src:
        type: file
        label: MP4 video
        options:
          accepts_mime_types:
            - video/mp4
          paths:
            uploads: public/videos/help
            static: public
          required: true
          required_message: Choose an MP4 video.
      webmSrc:
        type: file
        label: WebM video (optional)
        options:
          accepts_mime_types:
            - video/webm
          paths:
            uploads: public/videos/help
            static: public
      poster:
        type: image
        label: Poster image
        options:
          accepts_mime_types:
            - image/jpeg
            - image/png
            - image/webp
          paths:
            uploads: public/videos/help
            static: public
      ratio:
        type: select
        options:
          values: [16 / 9, 16 / 10, 4 / 3, 1 / 1, 1144 / 750, 964 / 720]
  link_cards:
    template: mdx_component
    inline: false
    preview:
      text: [Link cards]
      icon: link
    picker_preview:
      text: [Link cards]
      icon: [link]
    definitions:
      component_name: LinkCards
      named_args:
        - editor_key: items
          type: array
    _inputs:
      items:
        type: array
        options:
          structures: _structures.link_card_items
  accordion:
    template: mdx_component
    inline: false
    preview:
      text: [Accordion]
      icon: help
    picker_preview:
      text: [Accordion]
      icon: [help]
    definitions:
      component_name: Accordion
      named_args:
        - editor_key: items
          type: array
    _inputs:
      items:
        type: array
        options:
          structures: _structures.accordion_items
  action_links:
    template: mdx_component
    inline: false
    preview:
      text: [Action links]
      icon: ads_click
    picker_preview:
      text: [Action links]
      icon: [ads_click]
    definitions:
      component_name: ActionLinks
      named_args:
        - editor_key: items
          type: array
    _inputs:
      items:
        type: array
        options:
          structures: _structures.action_link_items
  steps:
    template: mdx_component
    inline: false
    preview:
      text: [Steps]
      icon: list
    picker_preview:
      text: [Steps]
      icon: [list]
    definitions:
      component_name: Steps
      named_args:
        - editor_key: items
          type: array
    _inputs:
      items:
        type: array
        options:
          structures: _structures.step_items
  card_grid:
    template: mdx_component
    inline: false
    preview:
      text: [Card grid]
      icon: dashboard
    picker_preview:
      text: [Card grid]
      icon: [dashboard]
    definitions:
      component_name: CardGrid
      named_args:
        - editor_key: columns
          type: number
          default: 2
          allowed_values: [2, 3]
        - editor_key: items
          type: array
    _inputs:
      columns:
        type: number
        options:
          min: 2
          max: 3
      items:
        type: array
        options:
          structures: _structures.card_items

  # `<CardGrid>` has two authoring forms and both must round-trip.
  #
  # `card_grid` above is the self-closing form: cards come from an `items` array and
  # Card renders `content` as a PLAIN STRING (see Card.astro), so it cannot carry
  # markdown. `card_grid_paired` is the rich form, wrapping `<Card>` children whose
  # bodies are full markdown — links, bold, multi-paragraph ordered lists. Articles
  # like signing-in.mdx need the rich form; converting them to `items` would silently
  # flatten their markup. Different templates (mdx_component vs mdx_paired_component)
  # keep the two unambiguous.
  card_grid_paired:
    template: mdx_paired_component
    inline: false
    preview:
      text: [Card grid (rich)]
      icon: dashboard
    picker_preview:
      text: [Card grid (rich)]
      icon: [dashboard]
    definitions:
      component_name: CardGrid
      content_key: cards
      named_args:
        - editor_key: columns
          type: number
          default: 2
          allowed_values: [2, 3]
    _inputs:
      columns:
        type: number
        options:
          min: 2
          max: 3

  card:
    template: mdx_paired_component
    inline: false
    preview:
      text: [{ key: title }, Card]
      icon: article
    picker_preview:
      text: [Card]
      icon: [article]
    definitions:
      component_name: Card
      content_key: card_content
      named_args:
        - editor_key: title
          type: string
        - editor_key: badge
          type: string
          optional: true
          remove_empty: true
