  practiceCount:
    type: number
  since:
    type: number
  isNew:
    type: switch
  pubDate:
    type: datetime
  updatedDate:
    type: datetime
  publishedDate:
    type: datetime
  title:
    type: text
  name:
    type: text
  shortName:
    type: text
  role:
    type: text
  org:
    type: text
  location:
    type: text
  author:
    type: text
  authorRole:
    type: text
  readingTime:
    type: text
  metaTitle:
    type: text
  seoTitle:
    type: text
  description:
    type: textarea
  metaDescription:
    type: textarea
  seoDescription:
    type: textarea
  blurb:
    type: textarea
  dek:
    type: textarea
  intro:
    type: textarea
  body:
    type: textarea
  text:
    type: textarea
  quote:
    type: textarea
  answer:
    type: textarea
  href:
    type: url
  audioSrc:
    type: url
  transcriptHref:
    type: url
  captionsSrc:
    type: url
  durationSec:
    type: number
