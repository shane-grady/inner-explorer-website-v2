  card_grid:
    template: mdx_component
    inline: false
    preview:
      text: [Card grid]
      icon: dashboard
    picker_preview:
      text: [Card grid]
      icon: [dashboard]
    definitions:
      component_name: CardGrid
      named_args:
        - editor_key: columns
          type: number
          default: 2
          allowed_values: [2, 3]
        - editor_key: items
          type: array
    _inputs:
      columns:
        type: number
        options:
          min: 2
          max: 3
      items:
        type: array
        options:
          structures: _structures.card_items

  # `<CardGrid>` has two authoring forms and both must round-trip.
  #
  # `card_grid` above is the self-closing form: cards come from an `items` array and
  # Card renders `content` as a PLAIN STRING (see Card.astro), so it cannot carry
  # markdown. `card_grid_paired` is the rich form, wrapping `<Card>` children whose
  # bodies are full markdown — links, bold, multi-paragraph ordered lists. Articles
  # like signing-in.mdx need the rich form; converting them to `items` would silently
  # flatten their markup. Different templates (mdx_component vs mdx_paired_component)
  # keep the two unambiguous.
  card_grid_paired:
    template: mdx_paired_component
    inline: false
    preview:
      text: [Card grid (rich)]
      icon: dashboard
    picker_preview:
      text: [Card grid (rich)]
      icon: [dashboard]
    definitions:
      component_name: CardGrid
      content_key: cards
      named_args:
        - editor_key: columns
          type: number
          default: 2
          allowed_values: [2, 3]
    _inputs:
      columns:
        type: number
        options:
          min: 2
          max: 3

  card:
    template: mdx_paired_component
    inline: false
    preview:
      text: [{ key: title }, Card]
      icon: article
    picker_preview:
      text: [Card]
      icon: [article]
    definitions:
      component_name: Card
      content_key: card_content
      named_args:
        - editor_key: title
          type: string
        - editor_key: badge
          type: string
          optional: true
          remove_empty: true
