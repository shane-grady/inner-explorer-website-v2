        options: &inline_html_options
          styles: .cloudcannon/styles/editor.css
          allow_custom_markup: true
          bold: true
          italic: true
          underline: false
          strike: false
          subscript: false
          superscript: false
          link: false
          removeformat: true
          undo: true
          redo: true
      category:
        type: select
        options:
          values: _select_data.blog_categories
