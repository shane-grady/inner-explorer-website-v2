data_config:
  navigation:
    path: src/data/navigation.json
  footer:
    path: src/data/footer.json
  # Shared Help Center UI copy. Bound with ABSOLUTE `@data[help-ui].<path>` regions,
  # because every help page except an article is not a collection entry and a relative
  # path would have no backing file to resolve against.
  help-ui:
    path: src/data/help-ui.json

file_config:
  - glob: src/data/navigation.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: menu
      items:
        type: array
        options:
          structures: _structures.navigation_items
      signIn:
        type: object
        options:
          structures: _structures.link_object
          preview:
            icon: link
      primaryCta:
        type: object
        options:
          structures: _structures.link_object
          preview:
            icon: ads_click
      mobileMenuLabel:
        type: text
  - glob: src/data/footer.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: list
      tagline:
        type: textarea
      groups:
        type: array
        options:
          structures: _structures.footer_groups
      legalLinks:
        type: array
        comment: Policy links in the bottom legal row (privacy policy, terms).
        options:
          structures: _structures.navigation_items
      legalStartYear:
        type: number
      legalName:
        type: text
      nonprofitLabel:
        type: text
      closing:
        type: text
  # Help Center shared UI copy (help.innerexplorer.com). Leaf inputs are keyed by bare
  # name — CloudCannon matches input keys at any depth and the glob scopes them to this
  # file. Group LABELS are not here: those are the nav model in src/lib/help.ts,
  # mirrored by _select_data.help_groups.
  - glob: src/data/help-ui.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: help
      chrome:
        type: object
        comment: Header bar and footer strings shared by every Help Center page.
        options:
          preview:
            icon: web
      sidebar:
        type: object
        comment: The docs sidebar — search, "Browse all guides", support card.
        options:
          preview:
            icon: menu
      home:
        type: object
        comment: Help Center home page — SEO metadata and hero copy.
        options:
          preview:
            icon: home
      search:
        type: object
        comment: The large search field on the Help Center home page.
        options:
          preview:
            icon: search
      support:
        type: object
        comment: '"Still need a hand?" banner at the foot of the home page.'
        options:
          preview:
            icon: support_agent
      notFound:
        type: object
        comment: Help Center 404 page.
        options:
          preview:
            icon: error
      brandName:
        type: text
      brandLabel:
        type: text
      legalName:
        type: text
      supportEmail:
        type: text
        comment: >-
          The single support address, used by the footer, the home banner, and the
          sidebar support card. Confirmed 2026-08-25 as support@innerexplorer.com; it
          was previously split across two fields that had drifted (.org vs .com).
      searchLabel:
        type: text
        comment: Screen-reader label for the sidebar search field.
      searchPlaceholder:
        type: text
      browseLabel:
        type: text
      navEmpty:
        type: text
        comment: Shown when a sidebar search matches no guides.
      supportTitle:
        type: text
      supportText:
        type: text
      supportCta:
        type: text
      seoTitle:
        type: text
      seoDescription:
        type: textarea
        comment: Meta description only — the on-page hero paragraph is `intro`.
      shareImageAlt:
        type: text
        comment: Alt text for the social share image.
      titleLine1:
        type: text
        comment: First line of the home headline; a hard line break follows it.
      titleLine2:
        type: text
        comment: Second line of the home headline.
      eyebrow:
        type: text
      intro:
        type: textarea
        comment: The on-page hero paragraph on the Help Center home.
      title:
        type: text
      body:
        type: textarea
      label:
        type: text
        comment: Screen-reader label for the home search field.
      placeholder:
        type: text
      empty:
        type: textarea
        comment: Shown when a home search matches no cards.
      textBefore:
        type: text
        comment: Sentence fragment before the support email link.
      textAfter:
        type: text
        comment: Sentence fragment after the support email link; starts with a semicolon.
      homeLink:
        type: text

