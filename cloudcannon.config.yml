      named_args:
        - editor_key: title
          type: string
        - editor_key: meta
          type: string
          optional: true
          remove_empty: true
        - editor_key: href
          type: string
          optional: true
          remove_empty: true
        - editor_key: eyebrow
          type: string
          optional: true
          remove_empty: true
        - editor_key: cta
          type: string
          optional: true
          remove_empty: true
  audio_practice:
    template: mdx_component
    inline: false
    preview:
      text: [{ key: title }, Audio practice]
      icon: headphones
    picker_preview:
      text: [Audio practice]
      icon: [headphones]
    definitions:
      component_name: AudioPractice
      named_args:
        - editor_key: audioSrc
          type: string
        - editor_key: durationSec
          type: number
        - editor_key: title
          type: string
        - editor_key: eyebrow
          type: string
          optional: true
          remove_empty: true
        - editor_key: transcriptHref
          type: string
          optional: true
          remove_empty: true
        - editor_key: captionsSrc
          type: string
          optional: true
          remove_empty: true
  callout:
    template: mdx_paired_component
    inline: false
    preview:
      text: [{ key: label }, Callout]
      icon: info
    picker_preview:
      text: [Callout]
      icon: [info]
    definitions:
      component_name: Callout
      content_key: callout_content
      named_args:
        # `optional: true` matters for MATCHING, not just for validation: a named_arg
        # without it must be present in the markup or CloudCannon fails to match the
        # snippet and shows "cannot be edited — Unexpected element". A `default` does
        # NOT make an arg optional. Callout.astro defaults `type` to 'tip', so the two
        # usages that omit it (privacy-policy.mdx, signing-in.mdx) render correctly but
        # were uneditable until this was marked optional.
        - editor_key: type
          type: string
          default: tip
          optional: true
          allowed_values: [tip, note, good]
        - editor_key: label
          type: string
          optional: true
          remove_empty: true
        # Callout.astro also accepts `heading`, which promotes the aside from a quiet
        # note to a signposted one. It was missing here, so every `<Callout heading=…>`
        # was unmatched and the editor showed "<callout> cannot be edited — Unexpected
        # element" instead of the snippet.
        - editor_key: heading
          type: string
          optional: true
          remove_empty: true
    _inputs:
      type:
        type: select
        options:
          values: [tip, note, good]
      heading:
        type: text
        comment: Optional. Replaces the small eyebrow with a sentence-case heading.
  help_figure:
    template: mdx_component
    inline: false
    preview:
      text: [{ key: label }, Help figure]
      icon: image
    picker_preview:
      text: [Help figure]
      icon: [image]
    definitions:
      component_name: HelpFigure
      named_args:
        - editor_key: label
          type: string
        - editor_key: caption
          type: string
          optional: true
          remove_empty: true
        - editor_key: ratio
          type: string
          optional: true
          default: 16 / 9
          remove_empty: true
        - editor_key: src
          type: string
          optional: true
          remove_empty: true
        - editor_key: alt
          type: string
          optional: true
          remove_empty: true
    _inputs:
