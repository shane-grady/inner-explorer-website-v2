version: latest
timezone: America/New_York

commit_templates:
  - label: Marketing update
    template_string: |-
      CMS: {summary|trim}

      [changes]

      Edited by [author] on [date]
    _inputs:
      summary:
        type: textarea
        label: What changed and why?
        options:
          required: true
          required_message: Briefly describe what changed and why.

paths:
  static: public
  uploads: public/images

markdown:
  engine: commonmark
  options:
    gfm: true
    escape_snippets_in_code_blocks: true

collection_groups:
  - heading: Marketing pages
    collections:
      - pages
  - heading: Pages and stories
    collections:
      - blog
      - caseStudies
      - help
  - heading: Program content
    collections:
      - narrators
      - series
  - heading: Shared content
    collections:
      - testimonials
      - data

collections_config:
  # One entry per bespoke marketing route. These are SINGLETONS: the route file in
  # src/pages/ decides what exists, so adding or removing entries here would just
  # orphan a file — hence disable_add. `url` uses a DATA placeholder ({permalink},
  # braces) rather than a fixed placeholder ([slug], brackets); that is what lets the
  # homepage live at '/' instead of '/index/'.
  pages:
    path: src/content/pages
    url: '{permalink}'
    name: Marketing pages
    singular_name: Marketing page
    icon: web
    schema_key: _schema
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - visual
      - data
    # Only keys EVERY page entry shares belong here. Anything page-specific goes under
    # `schemas` below: different routes legitimately reuse key names like `sections`
    # for different shapes, and a collection-level _input would apply one page's
    # structures to another page's data.
    _inputs:
      _schema:
        type: text
        hidden: true
      permalink:
        type: text
        hidden: true
      pageTitle:
        comment: Browser tab + search result title.
      pageDescription:
        type: textarea
        comment: Meta description shown in search results.
    schemas:
      # `path` names a schema template. Keep it outside the collection: CloudCannon
      # excludes schema-template files from collection listings, so pointing these
      # paths at the live singleton files would hide all 13 Marketing pages.
      faq:
        path: .cloudcannon/schemas/marketing-page.yml
        name: FAQ
        icon: help
        preview: &marketing_page_preview
          text: [{ key: pageTitle }, Marketing page]
          subtext: [{ key: permalink }]
        _inputs:
          'sections[*]':
            type: object
            options:
              preview:
                icon: article
          'sections[*].items':
            type: array
            options:
              structures: _structures.page_sections_items
              min_items: 1
          'pricing.features':
            type: array
            options:
              structures: _structures.page_origin_paragraphs
              min_items: 1
          'closer.ctas':
            type: array
            options:
              structures: _structures.page_closer_ctas
              min_items: 1
          'closer.quotes':
            type: array
            options:
              structures: _structures.page_closer_quotes
              min_items: 1
          hero:
            type: object
            options:
              structures: _structures.page_faq_hero_object
              preview:
                icon: title
          sections:
            type: array
            options:
              structures: _structures.page_faq_sections
              min_items: 12
              max_items: 12
              disable_add: true
              disable_remove: true
              disable_reorder: true
          pricing:
            type: object
            options:
              structures: _structures.page_faq_pricing_object
              preview:
                icon: sell
          closer:
            type: object
            options:
              structures: _structures.page_faq_closer_object
              preview:
                icon: format_quote
          features:
            type: array
            comment: One line per bullet.
          quotes:
            type: array
            options:
              structures: _structures.quote_items
              min_items: 1
          ctas:
            type: array
            options:
              structures: _structures.cta_links
              max_items: 2
      # The schemas below are generated against each page's real data: only key names
      # that resolve to ONE shape in that file are declared, because CloudCannon matches
      # an _inputs key by NAME at any depth. `stats` in about.yml and home.yml, and
      # `items` in districts.yml, each appear with several shapes and are therefore
      # deliberately absent — declaring them would mis-type every other use.
      # `pnpm lint:editables` fails the build if an ambiguous name is ever declared.
      contact:
