version: latest
timezone: America/New_York

commit_templates:
  - label: Help Center update
    template_string: |-
      CMS: {summary|trim}

      Edited by [author] on [date]
    _inputs:
      summary:
        type: textarea
        label: What changed and why?
        options:
          required: true
          required_message: Briefly describe what changed and why.

# Fallback for any upload that has no input-level `paths`. Every upload-capable input
# below sets its own, and the Content Editor's inline image tool is off, so in practice
# this is where the file browser puts a new upload: the one folder the help build reads
# CMS image paths from (src-help/lib/content-images.ts). public/ is shared with the
# marketing build, so the CMS never uploads there except into public/videos/help.
paths:
  static: public
  uploads: src-help/assets/images

markdown:
  engine: commonmark
  options:
    gfm: true
    escape_snippets_in_code_blocks: true

collection_groups:
  - heading: Help Center
    collections:
      - help
      - data

collections_config:
  help:
    # Card previews are configured explicitly rather than relying on CloudCannon's
    # auto screenshots: those regenerate after every build and are frequently absent,
    # which is why the collection browser showed "No preview available" on nearly every
    # item. Reading the entry's own data renders instantly and never goes stale.
    preview:
      text:
        - key: title
      subtext:
        - key: blurb
    path: src/content/help
    name: Help center
    singular_name: Help article
    description: Guided instructions for educators, administrators, and families.
    icon: help
    # Articles live at the ROOT of help.innerexplorer.com, and CloudCannon builds that
    # same site (dist-help), so the editor previews each article at its live URL.
    url: /[slug]/
    new_preview_url: /welcome/
    _enabled_editors:
      - visual
      - content
      - data
    schemas: null
    create:
      path: '[relative_base_path]/{title|slugify}[count].mdx'
    add_options:
      - name: Help article
        default_content_file: .cloudcannon/schemas/help-article.md
        icon: help
        editor: content
    _inputs:
      group:
        type: select
        options:
          value_key: id
          preview:
            text:
              - key: name
          values: _select_data.help_groups
      keywords:
        type: multiselect
        options:
          values: collections.help[*].keywords
          allow_create: true
      canonicalUrl:
        type: url
        comment: >-
          Only when this document's canonical home is another page. The privacy policy
          lives at innerexplorer.com/privacy-policy, so the article points search
          engines there instead of competing with it. Leave empty otherwise.

  data:
    path: src/data
    name: Site settings
    singular_name: Settings file
    description: Shared Help Center text — header, footer, sidebar, home page, and 404.
    # Must list every file registered in `data_config`, or the file is bindable on a
    # page via @data[key] but unreachable in the sidebar — so any field that is not
    # rendered on some page (SEO copy, the 404) becomes uneditable.
    glob:
      - help-ui.json
    icon: settings
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    disable_url: true
    _enabled_editors:
      - data

data_config:
  # Shared Help Center UI copy. Bound with ABSOLUTE `@data[help-ui].<path>` regions,
  # because every help page except an article is not a collection entry and a relative
  # path would have no backing file to resolve against.
  help-ui:
    path: src/data/help-ui.json

file_config:
  # Help Center shared UI copy (help.innerexplorer.com). Leaf inputs are keyed by bare
  # name — CloudCannon matches input keys at any depth and the glob scopes them to this
  # file. Group LABELS are not here: those are the nav model in src-help/lib/help.ts,
  # mirrored by _select_data.help_groups.
  - glob: src/data/help-ui.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: help
      chrome:
        type: object
        comment: Header bar and footer strings shared by every Help Center page.
        options:
          preview:
            icon: web
      sidebar:
        type: object
        comment: The docs sidebar — search, "Browse all guides", support card.
        options:
          preview:
            icon: menu
      home:
        type: object
        comment: Help Center home page — SEO metadata and hero copy.
        options:
          preview:
            icon: home
      search:
        type: object
        comment: The large search field on the Help Center home page.
        options:
          preview:
            icon: search
      support:
        type: object
        comment: '"Still need a hand?" banner at the foot of the home page.'
        options:
          preview:
            icon: support_agent
      notFound:
        type: object
        comment: Help Center 404 page.
        options:
          preview:
            icon: error
      brandName:
        type: text
      brandLabel:
        type: text
      legalName:
        type: text
      supportEmail:
        type: text
        comment: >-
          The single support address, used by the footer, the home banner, and the
          sidebar support card. Confirmed 2026-08-25 as support@innerexplorer.com; it
          was previously split across two fields that had drifted (.org vs .com).
      searchLabel:
        type: text
        comment: Screen-reader label for the sidebar search field.
      searchPlaceholder:
        type: text
      browseLabel:
        type: text
      navEmpty:
        type: text
        comment: Shown when a sidebar search matches no guides.
      supportTitle:
        type: text
      supportText:
        type: text
      supportCta:
        type: text
      seoTitle:
        type: text
      seoDescription:
        type: textarea
        comment: Meta description only — the on-page hero paragraph is `intro`.
      shareImageAlt:
        type: text
        comment: Alt text for the social share image.
      titleLine1:
        type: text
        comment: First line of the home headline; a hard line break follows it.
      titleLine2:
        type: text
        comment: Second line of the home headline.
      eyebrow:
        type: text
      intro:
        type: textarea
        comment: The on-page hero paragraph on the Help Center home.
      title:
        type: text
      body:
        type: textarea
      label:
        type: text
        comment: Screen-reader label for the home search field.
      placeholder:
        type: text
      empty:
        type: textarea
        comment: Shown when a home search matches no cards.
      textBefore:
        type: text
        comment: Sentence fragment before the support email link.
      textAfter:
        type: text
        comment: Sentence fragment after the support email link; starts with a semicolon.
      homeLink:
        type: text

_select_data:
  # Mirrors helpGroups in src-help/lib/help.ts (ids + labels + order) and the `group`
  # z.enum in src-help/lib/help-collection.ts. All three must agree: a value missing
  # here shows the editor a select with no matching option, and saving silently
  # reclassifies the article.
  help_groups:
    - name: Getting started
      id: start
    - name: For educators
      id: educators
    - name: For support staff
      id: counselors
    - name: For administrators
      id: admins
    - name: For families
      id: families
    - name: Policies
      id: policies

# Keys shared by help article front matter (src-help/lib/help-collection.ts) and the
# snippet parameters below. help-ui.json declares its own inputs under `file_config`.
_inputs:
  draft:
    type: switch
    comment: Draft items are not published to the live site.
  order:
    type: number
  title:
    type: text
  readingTime:
    type: text
  seoTitle:
    type: text
  seoDescription:
    type: textarea
  blurb:
    type: textarea
  href:
    type: url
  alt:
    type: text
  aHtml:
    type: html
    options: &inline_html_options
      allow_custom_markup: true
      bold: true
      italic: true
      underline: false
      strike: false
      subscript: false
      superscript: false
      link: false
      removeformat: true
      undo: true
      redo: true

_editables:
  content:
    blockquote: true
    bold: true
    bulletedlist: true
    code_inline: true
    format: p h2 h3 h4
    horizontalrule: true
    image: false
    italic: true
    link: true
    numberedlist: true
    removeformat: true
    snippet: true
    table: true

_structures:
  link_card_items:
    style: modal
    values:
      - label: Link card
        icon: link
        picker_preview:
          text: [Link card]
          icon: [link]
        preview:
          text: [{ key: title }, Link card]
          subtext: [{ key: href }]
          icon: [link]
        value:
          title: ''
          sub: ''
          href: ''
  accordion_items:
    style: modal
    values:
      - label: Accordion item
        icon: help
        picker_preview:
          text: [Accordion item]
          icon: [help]
        preview:
          text: [{ key: q }, Accordion item]
          icon: [help]
        value:
          q: ''
          a: ''
          aHtml: ''
        _inputs:
          a:
            type: textarea
          aHtml:
            type: html
            options: *inline_html_options
  action_link_items:
    style: modal
    values:
      - label: Action link
        icon: ads_click
        picker_preview:
          text: [Action link]
          icon: [ads_click]
        preview:
          text: [{ key: label }, Action link]
          subtext: [{ key: href }]
          icon: [ads_click]
        value:
          label: ''
          href: ''
          variant: solid
          tone: brand
        _inputs:
          variant:
            type: select
            options:
              values: [solid, outline, ghost, link]
          tone:
            type: select
            options:
              values: [brand, accent, neutral, light]
  step_items:
    style: modal
    values:
      - label: Step
        icon: list
        picker_preview:
          text: [Step]
          icon: [list]
        preview:
          text: [{ key: title }, Step]
          icon: [list]
        value:
          title: ''
          content: ''
          contentHtml: ''
        _inputs:
          content:
            type: textarea
          contentHtml:
            type: html
            options: *inline_html_options
  card_items:
    style: modal
    values:
      - label: Card
        icon: article
        picker_preview:
          text: [Card]
          icon: [article]
        preview:
          text: [{ key: title }, Card]
          icon: [article]
        value:
          badge: ''
          title: ''
          content: ''
        _inputs:
          content:
            type: textarea

_snippets:
  callout:
    template: mdx_paired_component
    inline: false
    preview:
      text: [{ key: label }, Callout]
      icon: info
    picker_preview:
      text: [Callout]
      icon: [info]
    definitions:
      component_name: Callout
      content_key: callout_content
      named_args:
        # Keep the presentation variant explicit in authored MDX. CloudCannon
        # hydrates an omitted Select to its first option while parsing the document,
        # even when allow_empty is configured, which makes an unrelated no-op snippet
        # edit dirty the file. The default is used only when inserting a new Callout.
        - editor_key: type
          type: string
          default: tip
          allowed_values: [tip, note, good]
        - editor_key: label
          type: string
          optional: true
          remove_empty: true
        # Callout.astro also accepts `heading`, which promotes the aside from a quiet
        # note to a signposted one. It was missing here, so every `<Callout heading=…>`
        # was unmatched and the editor showed "<callout> cannot be edited — Unexpected
        # element" instead of the snippet.
        - editor_key: heading
          type: string
          optional: true
          remove_empty: true
    _inputs:
      type:
        type: select
        options:
          values: [tip, note, good]
      heading:
        type: text
        comment: Optional. Replaces the small eyebrow with a sentence-case heading.
  help_figure:
    template: mdx_component
    inline: false
    preview:
      text: [{ key: label }, Help figure]
      icon: image
    picker_preview:
      text: [Help figure]
      icon: [image]
    definitions:
      component_name: HelpFigure
      named_args:
        - editor_key: label
          type: string
        - editor_key: caption
          type: string
          optional: true
          remove_empty: true
        - editor_key: ratio
          type: string
          default: 16 / 9
        - editor_key: src
          type: string
          optional: true
          remove_empty: true
        - editor_key: alt
          type: string
          optional: true
          remove_empty: true
    _inputs:
      # HelpFigure optimises `src` through import.meta.glob('/src-help/assets/images/**')
      # (src-help/lib/content-images.ts), whose keys are full repo paths such as
      # /src-help/assets/images/x.png. `static: ''` makes CloudCannon write exactly that
      # (with `public` it strips the prefix). Relative upload paths stay off: a path
      # relative to the article (../../../src-help/…) is not a glob key and fails the build.
      src:
        type: image
        options:
          paths:
            uploads: /src-help/assets/images
            static: ''
      ratio:
        type: select
        options:
          values: [16 / 9, 4 / 3, 1 / 1]
  help_table:
    template: mdx_paired_component
    inline: false
    preview:
      text: [{ key: label }, Help table]
      icon: table_chart
    picker_preview:
      text: [Help table]
      icon: [table_chart]
    definitions:
      component_name: HelpTable
      content_key: table_markdown
      named_args:
        - editor_key: label
          type: string
          optional: true
          remove_empty: true
  help_video:
    template: mdx_component
    inline: false
    preview:
      text: [{ key: label }, Help video]
      icon: play_circle
    picker_preview:
      text: [Help video]
      icon: [play_circle]
    definitions:
      component_name: HelpVideo
      named_args:
        - editor_key: label
          type: string
        - editor_key: ratio
          type: string
          default: 16 / 9
        - editor_key: src
          type: string
        - editor_key: webmSrc
          type: string
          optional: true
          remove_empty: true
        - editor_key: poster
          type: string
          optional: true
          remove_empty: true
        - editor_key: caption
          type: string
          optional: true
          remove_empty: true
    _inputs:
      src:
        type: file
        label: MP4 video
        options:
          accepts_mime_types:
            - video/mp4
          paths:
            uploads: public/videos/help
            static: public
          required: true
          required_message: Choose an MP4 video.
      webmSrc:
        type: file
        label: WebM video (optional)
        options:
          accepts_mime_types:
            - video/webm
          paths:
            uploads: public/videos/help
            static: public
      poster:
        type: image
        label: Poster image
        options:
          accepts_mime_types:
            - image/jpeg
            - image/png
            - image/webp
          paths:
            uploads: public/videos/help
            static: public
      ratio:
        type: select
        options:
          values: [16 / 9, 16 / 10, 4 / 3, 1 / 1, 1144 / 750, 964 / 720]
  link_cards:
    template: mdx_component
    inline: false
    preview:
      text: [Link cards]
      icon: link
    picker_preview:
      text: [Link cards]
      icon: [link]
    definitions:
      component_name: LinkCards
      named_args:
        - editor_key: items
          type: array
    _inputs:
      items:
        type: array
        options:
          structures: _structures.link_card_items
  accordion:
    template: mdx_component
    inline: false
    preview:
      text: [Accordion]
      icon: help
    picker_preview:
      text: [Accordion]
      icon: [help]
    definitions:
      component_name: Accordion
      named_args:
        - editor_key: items
          type: array
    _inputs:
      items:
        type: array
        options:
          structures: _structures.accordion_items
  action_links:
    template: mdx_component
    inline: false
    preview:
      text: [Action links]
      icon: ads_click
    picker_preview:
      text: [Action links]
      icon: [ads_click]
    definitions:
      component_name: ActionLinks
      named_args:
        - editor_key: items
          type: array
    _inputs:
      items:
        type: array
        options:
          structures: _structures.action_link_items
  steps:
    template: mdx_component
    inline: false
    preview:
      text: [Steps]
      icon: list
    picker_preview:
      text: [Steps]
      icon: [list]
    definitions:
      component_name: Steps
      named_args:
        - editor_key: items
          type: array
    _inputs:
      items:
        type: array
        options:
          structures: _structures.step_items
  card_grid:
    template: mdx_component
    inline: false
    preview:
      text: [Card grid]
      icon: dashboard
    picker_preview:
      text: [Card grid]
      icon: [dashboard]
    definitions:
      component_name: CardGrid
      named_args:
        - editor_key: columns
          type: number
          default: 2
          allowed_values: [2, 3]
        - editor_key: items
          type: array
    _inputs:
      columns:
        type: number
        options:
          min: 2
          max: 3
      items:
        type: array
        options:
          structures: _structures.card_items

  # `<CardGrid>` has two authoring forms and both must round-trip.
  #
  # `card_grid` above is the self-closing form: cards come from an `items` array and
  # Card renders `content` as a PLAIN STRING (see Card.astro), so it cannot carry
  # markdown. `card_grid_paired` is the rich form, wrapping `<Card>` children whose
  # bodies are full markdown — links, bold, multi-paragraph ordered lists. Articles
  # like signing-in.mdx need the rich form; converting them to `items` would silently
  # flatten their markup. Different templates (mdx_component vs mdx_paired_component)
  # keep the two unambiguous.
  card_grid_paired:
    template: mdx_paired_component
    inline: false
    preview:
      text: [Card grid (rich)]
      icon: dashboard
    picker_preview:
      text: [Card grid (rich)]
      icon: [dashboard]
    definitions:
      component_name: CardGrid
      content_key: cards
      named_args:
        - editor_key: columns
          type: number
          default: 2
          allowed_values: [2, 3]
    _inputs:
      columns:
        type: number
        options:
          min: 2
          max: 3

  card:
    template: mdx_paired_component
    inline: false
    preview:
      text: [{ key: title }, Card]
      icon: article
    picker_preview:
      text: [Card]
      icon: [article]
    definitions:
      component_name: Card
      content_key: card_content
      named_args:
        - editor_key: title
          type: string
        - editor_key: badge
          type: string
          optional: true
          remove_empty: true
