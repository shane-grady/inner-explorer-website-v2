  blog:
    # Card previews are configured explicitly rather than relying on CloudCannon's
    # auto screenshots: those regenerate after every build and are frequently absent,
    # which is why the collection browser showed "No preview available" on nearly every
    # item. Reading the entry's own data renders instantly and never goes stale.
    # NOTE: no `image` here on purpose. Card previews can only show an image the CMS
    # can fetch by URL, and every content image on this site is stored as a path into
    # src/assets/ (e.g. ../../assets/images/...) so Astro can optimise it. Astro emits
    # those as content-hashed /_astro/ files; the source path itself 404s. Adding
    # `image` therefore renders an empty band rather than a thumbnail. Text + subtext
    # come from the entry's own data and always resolve.
    preview:
      text:
        - key: title
      subtext:
        - key: category
    path: src/content/blog
    name: Blog
    singular_name: Blog post
    description: Articles, research stories, and practical resources.
    icon: post_add
    url: /blog/[slug]/
    new_preview_url: /blog/inner-explorer-mtss-tiers/
    _enabled_editors:
      - visual
      - content
      - data
    add_options:
      - name: Blog post
        default_content_file: .cloudcannon/schemas/blog-post.md
        icon: post_add
        editor: content
    _inputs:
      titleHtml:
        type: html
        label: Styled headline
