      icon: [format_quote]
    definitions:
      component_name: PullQuote
      content_key: quote_text
      named_args:
        - editor_key: cite
          type: string
          optional: true
          remove_empty: true
  figure:
    template: mdx_component
    inline: false
    preview:
      text: [{ key: alt }, Figure]
      icon: image
    picker_preview:
      text: [Figure]
      icon: [image]
    definitions:
      component_name: Figure
      named_args:
        - editor_key: src
          type: string
        - editor_key: alt
          type: string
        - editor_key: caption
          type: string
          optional: true
          remove_empty: true
    _inputs:
      src: *optimized_image
      caption:
        type: textarea
  stat_row:
    template: mdx_component
    inline: false
    preview:
      text: [Statistics]
      icon: monitoring
    picker_preview:
      text: [Statistics]
      icon: [monitoring]
    definitions:
      component_name: StatRow
      named_args:
        - editor_key: stats
