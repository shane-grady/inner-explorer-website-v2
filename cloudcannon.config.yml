version: latest
timezone: America/New_York

paths:
  static: public
  uploads: public/images

markdown:
  engine: commonmark
  options:
    gfm: true
    escape_snippets_in_code_blocks: true

collection_groups:
  - heading: Marketing pages
    collections:
      - pages
  - heading: Pages and stories
    collections:
      - blog
      - caseStudies
      - help
  - heading: Program content
    collections:
      - narrators
      - series
  - heading: Shared content
    collections:
      - testimonials
      - data

collections_config:
  # One entry per bespoke marketing route. These are SINGLETONS: the route file in
  # src/pages/ decides what exists, so adding or removing entries here would just
  # orphan a file — hence disable_add. `url` uses a DATA placeholder ({permalink},
  # braces) rather than a fixed placeholder ([slug], brackets); that is what lets the
  # homepage live at '/' instead of '/index/'.
  pages:
    path: src/content/pages
    url: '{permalink}'
    name: Marketing pages
    singular_name: Marketing page
    icon: web
    schema_key: _schema
    disable_add: true
    disable_add_folder: true
    _enabled_editors:
      - visual
      - data
    # Only keys EVERY page entry shares belong here. Anything page-specific goes under
    # `schemas` below: different routes legitimately reuse key names like `sections`
    # for different shapes, and a collection-level _input would apply one page's
    # structures to another page's data.
    _inputs:
      _schema:
        type: text
        hidden: true
      permalink:
        type: text
        hidden: true
      pageTitle:
        comment: Browser tab + search result title.
      pageDescription:
        type: textarea
        comment: Meta description shown in search results.
    schemas:
      # `path` is required by the config schema and names the template used when
      # creating a new entry. These routes are singletons (disable_add), so it never
      # gets cloned — pointing it at the live file keeps it honest and self-documenting.
      faq:
        path: src/content/pages/faq.yml
        name: FAQ
        icon: help
        _inputs:
          hero:
            type: object
            options:
              preview:
                icon: title
          sections:
            type: array
            options:
              structures: _structures.page_faq_sections
              min_items: 1
          pricing:
            type: object
            options:
              preview:
                icon: sell
          closer:
            type: object
            options:
              preview:
                icon: format_quote
          features:
            type: array
            comment: One line per bullet.
          quotes:
            type: array
            options:
              structures: _structures.quote_items
              min_items: 1
          ctas:
            type: array
            options:
              structures: _structures.cta_links
              max_items: 2
      # The schemas below are generated against each page's real data: only key names
      # that resolve to ONE shape in that file are declared, because CloudCannon matches
      # an _inputs key by NAME at any depth. `stats` in about.yml and home.yml, and
      # `items` in districts.yml, each appear with several shapes and are therefore
      # deliberately absent — declaring them would mis-type every other use.
      # `pnpm lint:editables` fails the build if an ambiguous name is ever declared.
      contact:
        path: src/content/pages/contact.yml
        name: Contact
        icon: contact_mail
        _inputs:
          blurb:
            type: textarea
          confirmation:
            type: textarea
          intro:
            type: textarea
      platform:
        path: src/content/pages/platform.yml
        name: Platform
        icon: devices
        _inputs:
          claimHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          headingHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          desc:
            type: textarea
          excerpt:
            type: textarea
          lead:
            type: textarea
          quote:
            type: textarea
          subtitle:
            type: textarea
          text:
            type: textarea
      research:
        path: src/content/pages/research.yml
        name: Research
        icon: science
        _inputs:
          headingHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          pullQuoteHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          copy:
            type: textarea
          lede:
            type: textarea
          quote:
            type: textarea
          subtitle:
            type: textarea
      about:
        path: src/content/pages/about.yml
        preview:
          image:
            - key: hero.image
        name: About
        icon: groups
        _inputs:
          findHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          headingHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          pullHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          quoteHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          body:
            type: textarea
          lede:
            type: textarea
          quote:
            type: textarea
          subtitle:
            type: textarea
      narrators-index:
        path: src/content/pages/narrators-index.yml
        preview:
          image:
            - key: momentsRail.moments.0.img
        name: Narrators (index)
        icon: record_voice_over
        _inputs:
          headingHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          quoteHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          subtitleHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          cardBody:
            type: textarea
      districts:
        path: src/content/pages/districts.yml
        preview:
          image:
            - key: hero.image
        name: Districts
        icon: school
        _inputs:
          bodyHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          titleHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          a:
            type: textarea
          blurb:
            type: textarea
          body:
            type: textarea
          intro:
            type: textarea
          quote:
            type: textarea
          shortVersion:
            type: textarea
      pricing:
        path: src/content/pages/pricing.yml
        name: Pricing
        icon: sell
        _inputs:
          titleHtml:
            type: text
            comment: Inline HTML allowed — edit here rather than on the page.
          blurb:
            type: textarea
          footnote:
            type: textarea
          intro:
            type: textarea
          note:
            type: textarea
          subtitle:
            type: textarea
      newsroom:
        path: src/content/pages/newsroom.yml
        name: Newsroom
        icon: newspaper
      home:
        path: src/content/pages/home.yml
        name: Home
        icon: home
        _inputs:
          body:
            type: textarea
          lede:
            type: textarea
          manifesto:
            type: textarea
      blog-index:
        path: src/content/pages/blog-index.yml
        name: Blog (index)
        icon: post_add
      case-studies-index:
        path: src/content/pages/case-studies-index.yml
        name: Case studies (index)
        icon: menu_book
        _inputs:
          intro:
            type: textarea
          subtitle:
            type: textarea
  blog:
    # Card previews are configured explicitly rather than relying on CloudCannon's
    # auto screenshots: those regenerate after every build and are frequently absent,
    # which is why the collection browser showed "No preview available" on nearly every
    # item. Reading the entry's own data renders instantly and never goes stale.
    preview:
      text:
        - key: title
      subtext:
        - key: category
      image:
        - key: heroImage
    path: src/content/blog
    name: Blog
    singular_name: Blog post
    description: Articles, research stories, and practical resources.
    icon: post_add
    url: /blog/[slug]/
    _enabled_editors:
      - visual
      - content
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/blog-post.md
        name: Blog post
        new_preview_url: /blog/inner-explorer-mtss-tiers/
    add_options:
      - name: Blog post
        schema: default
        icon: post_add
        editor: content
    _inputs:
      titleHtml:
        type: html
        label: Styled headline
        comment: Optional display headline. Keep the plain title as the SEO source of truth.
        options: &inline_html_options
          styles: .cloudcannon/styles/editor.css
          allow_custom_markup: true
          bold: true
          italic: true
          underline: false
          strike: false
          subscript: false
          superscript: false
          link: false
          removeformat: true
          undo: true
          redo: true
      category:
        type: select
        options:
          allow_create: true
          values: _select_data.blog_categories
      tags:
        type: multiselect
        options:
          allow_create: true
          values: _select_data.blog_tags
      quickRead:
        type: object
        options:
          structures: _structures.quick_read
          preview:
            icon: article
      faq:
        type: object
        options:
          structures: _structures.article_faq
          preview:
            icon: help

  caseStudies:
    # Card previews are configured explicitly rather than relying on CloudCannon's
    # auto screenshots: those regenerate after every build and are frequently absent,
    # which is why the collection browser showed "No preview available" on nearly every
    # item. Reading the entry's own data renders instantly and never goes stale.
    preview:
      text:
        - key: meta.titleLead
      subtext:
        - key: district.name
      image:
        - key: meta.heroImage
    path: src/content/case-studies
    name: Case studies
    singular_name: Case study
    description: District and school success stories.
    icon: school
    url: /case-studies/[slug]/
    _enabled_editors:
      - visual
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/case-study.yml
        name: Case study
        new_preview_url: /case-studies/broward/
    add_options:
      - name: Case study
        schema: default
        icon: school
        editor: data
    _inputs:
      meta:
        type: object
        options:
          structures: _structures.case_meta
          preview:
            icon: article
      district:
        type: object
        options:
          structures: _structures.district
          preview:
            icon: school
      keyInsights:
        type: object
        options:
          structures: _structures.key_insights
          preview:
            icon: lightbulb
      intro:
        type: object
        options:
          structures: _structures.case_intro
          preview:
            icon: article
      timeline:
        type: object
        options:
          structures: _structures.timeline
          preview:
            icon: event_available
      metrics:
        type: object
        options:
          structures: _structures.metrics
          preview:
            icon: monitoring
      chart:
        type: object
        options:
          structures: _structures.chart
          preview:
            icon: monitoring
      charts:
        type: array
        options:
          structures: _structures.chart_items
      sources:
        type: array
        options:
          structures: _structures.sources
      editorialQuote:
        type: object
        options:
          structures: _structures.editorial_quote
          preview:
            icon: format_quote
      voicesIntro:
        type: object
        options:
          structures: _structures.voices_intro
          preview:
            icon: record_voice_over
      voices:
        type: array
        options:
          structures: _structures.voices
      gallery:
        type: object
        options:
          structures: _structures.gallery
          preview:
            icon: image
      faq:
        type: object
        options:
          structures: _structures.case_faq
          preview:
            icon: help
      cta:
        type: object
        options:
          structures: _structures.case_cta
          preview:
            icon: ads_click

  help:
    # Card previews are configured explicitly rather than relying on CloudCannon's
    # auto screenshots: those regenerate after every build and are frequently absent,
    # which is why the collection browser showed "No preview available" on nearly every
    # item. Reading the entry's own data renders instantly and never goes stale.
    preview:
      text:
        - key: title
      subtext:
        - key: blurb
    path: src/content/help
    name: Help center
    singular_name: Help article
    description: Guided instructions for educators, administrators, and families.
    icon: help
    url: /help/[slug]/
    _enabled_editors:
      - visual
      - content
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/help-article.md
        name: Help article
        new_preview_url: /help/welcome/
    add_options:
      - name: Help article
        schema: default
        icon: help
        editor: content
    _inputs:
      group:
        type: select
        options:
          value_key: id
          preview:
            text:
              - key: name
          values: _select_data.help_groups
      keywords:
        type: multiselect
        options:
          allow_create: true
          values: []

  narrators:
    # Card previews are configured explicitly rather than relying on CloudCannon's
    # auto screenshots: those regenerate after every build and are frequently absent,
    # which is why the collection browser showed "No preview available" on nearly every
    # item. Reading the entry's own data renders instantly and never goes stale.
    preview:
      text:
        - key: name
      subtext:
        - key: role
      image:
        - key: photo
    path: src/content/narrators
    name: Narrators
    singular_name: Narrator
    description: The voices who guide Inner Explorer practices.
    icon: record_voice_over
    url: /narrators/[slug]/
    _enabled_editors:
      - visual
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/narrator.yml
        name: Narrator
        new_preview_url: /narrators/maya-castellanos/
    add_options:
      - name: Narrator
        schema: default
        icon: record_voice_over
        editor: data
    _inputs:
      quote:
        type: object
        options:
          structures: _structures.narrator_quote
          preview:
            icon: format_quote
      voiceIntro:
        type: object
        options:
          structures: _structures.voice_intro
          preview:
            icon: headphones
      facts:
        type: array
        options:
          structures: _structures.value_labels
      qa:
        type: array
        options:
          structures: _structures.narrator_qa
      practices:
        type: array
        options:
          structures: _structures.narrator_practices
      langs:
        type: multiselect
        options:
          allow_create: true
          values: _select_data.languages

  series:
    # Card previews are configured explicitly rather than relying on CloudCannon's
    # auto screenshots: those regenerate after every build and are frequently absent,
    # which is why the collection browser showed "No preview available" on nearly every
    # item. Reading the entry's own data renders instantly and never goes stale.
    preview:
      text:
        - key: name
      subtext:
        - key: category
      image:
        - key: hero.image
    path: src/content/series
    name: Practice series
    singular_name: Practice series
    description: Supplemental mindfulness series and their practice details.
    icon: menu_book
    url: /series/[slug]/
    _enabled_editors:
      - visual
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/series.yml
        name: Practice series
        new_preview_url: /series/educator-wellbeing/
    add_options:
      - name: Practice series
        schema: default
        icon: menu_book
        editor: data
    _inputs:
      tone:
        type: select
        options:
          values:
            - sage
            - teal
            - slate
            - gold
      hero:
        type: object
        options:
          structures: _structures.series_hero
          preview:
            icon: image
      glance:
        type: array
        options:
          structures: _structures.series_glance
      audience:
        type: object
        options:
          structures: _structures.series_audience
          preview:
            icon: groups
      stats:
        type: object
        options:
          structures: _structures.series_stats
          preview:
            icon: monitoring
      practices:
        type: object
        options:
          structures: _structures.series_practices
          preview:
            icon: menu_book
      how:
        type: object
        options:
          structures: _structures.series_how
          preview:
            icon: list
      benefits:
        type: object
        options:
          structures: _structures.series_benefits
          preview:
            icon: favorite
      sample:
        type: object
        options:
          structures: _structures.series_sample
          preview:
            icon: play_circle
      testimonial:
        type: object
        options:
          structures: _structures.series_testimonial
          preview:
            icon: format_quote
      cta:
        type: object
        options:
          structures: _structures.series_cta
          preview:
            icon: ads_click

  testimonials:
    # Card previews are configured explicitly rather than relying on CloudCannon's
    # auto screenshots: those regenerate after every build and are frequently absent,
    # which is why the collection browser showed "No preview available" on nearly every
    # item. Reading the entry's own data renders instantly and never goes stale.
    preview:
      text:
        - key: name
      subtext:
        - key: org
    path: src/content/testimonials
    name: Testimonials
    singular_name: Testimonial
    description: Reusable quotes shown across the site.
    icon: format_quote
    disable_url: true
    _enabled_editors:
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/testimonial.yml
        name: Testimonial
    add_options:
      - name: Testimonial
        schema: default
        icon: format_quote
        editor: data

  data:
    path: src/data
    name: Site settings
    singular_name: Settings file
    description: Navigation, footer, and other shared site content.
    # Must list every file registered in `data_config`, or the file is bindable on a
    # page via @data[key] but unreachable in the sidebar — so any field that is not
    # rendered on some page (SEO copy, the 404) becomes uneditable.
    glob:
      - navigation.json
      - footer.json
      - help-ui.json
    icon: settings
    disable_add: true
    disable_url: true
    _enabled_editors:
      - data

data_config:
  navigation:
    path: src/data/navigation.json
  footer:
    path: src/data/footer.json
  # Shared Help Center UI copy. Bound with ABSOLUTE `@data[help-ui].<path>` regions,
  # because every help page except an article is not a collection entry and a relative
  # path would have no backing file to resolve against.
  help-ui:
    path: src/data/help-ui.json

file_config:
  - glob: src/data/navigation.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: menu
      items:
        type: array
        options:
          structures: _structures.navigation_items
      signIn:
        type: object
        options:
          structures: _structures.link_object
          preview:
            icon: link
      primaryCta:
        type: object
        options:
          structures: _structures.link_object
          preview:
            icon: ads_click
      mobileMenuLabel:
        type: text
  - glob: src/data/footer.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: list
      tagline:
        type: textarea
      groups:
        type: array
        options:
          structures: _structures.footer_groups
      legalStartYear:
        type: number
      legalName:
        type: text
      nonprofitLabel:
        type: text
      closing:
        type: text
  # Help Center shared UI copy (help.innerexplorer.com). Leaf inputs are keyed by bare
  # name — CloudCannon matches input keys at any depth and the glob scopes them to this
  # file. Group LABELS are not here: those are the nav model in src/lib/help.ts,
  # mirrored by _select_data.help_groups.
  - glob: src/data/help-ui.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: help
      chrome:
        type: object
        comment: Header bar and footer strings shared by every Help Center page.
        options:
          preview:
            icon: web
      sidebar:
        type: object
        comment: The docs sidebar — search, "Browse all guides", support card.
        options:
          preview:
            icon: menu
      home:
        type: object
        comment: Help Center home page — SEO metadata and hero copy.
        options:
          preview:
            icon: home
      search:
        type: object
        comment: The large search field on the Help Center home page.
        options:
          preview:
            icon: search
      support:
        type: object
        comment: '"Still need a hand?" banner at the foot of the home page.'
        options:
          preview:
            icon: support_agent
      notFound:
        type: object
        comment: Help Center 404 page.
        options:
          preview:
            icon: error
      brandName:
        type: text
      brandLabel:
        type: text
      legalName:
        type: text
      supportEmail:
        type: text
        comment: >-
          The single support address, used by the footer, the home banner, and the
          sidebar support card. Confirmed 2026-08-25 as support@innerexplorer.com; it
          was previously split across two fields that had drifted (.org vs .com).
      searchLabel:
        type: text
        comment: Screen-reader label for the sidebar search field.
      searchPlaceholder:
        type: text
      browseLabel:
        type: text
      navEmpty:
        type: text
        comment: Shown when a sidebar search matches no guides.
      supportTitle:
        type: text
      supportText:
        type: text
      supportCta:
        type: text
      seoTitle:
        type: text
      seoDescription:
        type: textarea
        comment: Meta description only — the on-page hero paragraph is `intro`.
      shareImageAlt:
        type: text
        comment: Alt text for the social share image.
      titleLine1:
        type: text
        comment: First line of the home headline; a hard line break follows it.
      titleLine2:
        type: text
        comment: Second line of the home headline.
      eyebrow:
        type: text
      intro:
        type: textarea
        comment: The on-page hero paragraph on the Help Center home.
      title:
        type: text
      body:
        type: textarea
      label:
        type: text
        comment: Screen-reader label for the home search field.
      placeholder:
        type: text
      empty:
        type: textarea
        comment: Shown when a home search matches no cards.
      textBefore:
        type: text
        comment: Sentence fragment before the support email link.
      textAfter:
        type: text
        comment: Sentence fragment after the support email link; starts with a semicolon.
      homeLink:
        type: text

_select_data:
  blog_categories:
    - Research
    - Practice
    - News
    - Resources
  blog_tags:
    - Administrators
    - Districts
    - Educators
    - Mental Health
    - Mindfulness
    - Research
    - SEL
  # Mirrors helpGroups in src/lib/help.ts (ids + labels + order) and the `group`
  # z.enum in src/lib/help-collection.ts. All three must agree: a value missing here
  # shows the editor a select with no matching option, and saving silently
  # reclassifies the article.
  help_groups:
    - name: Getting started
      id: start
    - name: For educators
      id: educators
    - name: For support staff
      id: counselors
    - name: For administrators
      id: admins
    - name: For families
      id: families
    - name: Policies
      id: policies
  languages:
    - English
    - Spanish
    - Portuguese
  # Mirrors the seriesIcon z.enum in src/content.config.ts. Without this the icon
  # field is free text in the editor and any typo fails the Astro build.
  series_icons:
    - clock
    - headphones
    - home
    - users
    - globe
    - presentation
    - lifebuoy
    - compass
    - play
    - map-pin
    - wind
    - focus
    - sparkles
    - repeat
    - shield
    - graduation-cap
    - heart
    - message-circle
    - rewind
    - heart-handshake
    - sprout
    - sun
    - tent
    - palette
    - star
    - award
    - flask

